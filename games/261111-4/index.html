<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
// ============================================================
//  World constants
// ============================================================
const NX = 100, NY = 106, N = NX * NY;
const K = 0.82;          // row foreshortening (screen y per world row)
const HK = 0.85;         // screen y per unit of snow height
const WD = (function(){ const l = Math.hypot(0.16, 1); return [0.16 / l, 1 / l]; })(); // wind direction
const WALL = 1.0;        // height that counts as wall for shapes
const HMAX = 5.4;
const SEAT_ROW = 71;
const SPLIT_ROW = 71.9;  // rows >= this are drawn in front of the children
const LIM = { flakes: 96, streaks: 44, packets: 12, crystals: 24, sparks: 48, steam: 18, stream: 22, puffs: 24 };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = Math.random;
const IX = (x, y) => y * NX + x;

// ============================================================
//  Fields
// ============================================================
let h = new Float32Array(N);       // snow height (the material)
const Hs = new Float32Array(N);    // rendered height (snow + roof - cuts)
const shadeF = new Float32Array(N);
const flagF = new Uint8Array(N);   // 0 snow, 1 interior dark, 2 interior glow, 3 old-house glow
const wF = new Float32Array(N);    // how much of the interior colour shows
const noiseF = new Float32Array(N);
const phi = new Float32Array(N), kc = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N), spd = new Float32Array(N), shel = new Float32Array(N);
const prot = new Uint8Array(N);    // 1 seat zone, 2 house ring (protected), 4 old house / back garden
const domeH = new Float32Array(N); // roof height of the kamakura
const inter = new Uint8Array(N);   // kamakura interior
const noDome = new Uint8Array(N);
const cutF = new Uint8Array(N);    // interior visible through openings (per frame)
const oldGlow = new Uint8Array(N);
const dep = new Float32Array(N);
const basin = new Float32Array(N), touchF = new Float32Array(N), tmpA = new Float32Array(N);   // snow gathered by the wind (not by hand)
let terrainDirty = true;

function hash(x, y) { let n = x * 374761393 + y * 668265263; n = (n ^ (n >>> 13)) * 1274126177; return ((n ^ (n >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(xi + seed, yi), b = hash(xi + 1 + seed, yi), c = hash(xi + seed, yi + 1), d = hash(xi + 1 + seed, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function sampleH(f, x, y) {
  x = clamp(x, 0, NX - 1.001); y = clamp(y, 0, NY - 1.001);
  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, k = j * NX + i;
  return lerp(lerp(f[k], f[k + 1], fx), lerp(f[k + NX], f[k + NX + 1], fx), fy);
}
function cellAt(x, y) { const i = Math.round(x), j = Math.round(y); if (i < 0 || j < 0 || i >= NX || j >= NY) return -1; return j * NX + i; }
function bump(cx, cy, rad, hgt, mode) { // mode 0: max, 1: add
  const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(NX - 1, Math.ceil(cx + rad));
  const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(NY - 1, Math.ceil(cy + rad));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = Math.hypot(x - cx, y - cy) / rad; if (d >= 1) continue;
    const s = 0.5 + 0.5 * Math.cos(d * Math.PI), k = IX(x, y);
    if (mode === 1) h[k] = Math.min(HMAX, h[k] + hgt * s); else h[k] = Math.max(h[k], 0.4 + hgt * s);
  }
}
function ridgeLine(x0, y0, x1, y1, rad, hgt) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 3);
  for (let i = 0; i <= n; i++) { const t = i / n; bump(lerp(x0, x1, t), lerp(y0, y1, t), rad, hgt, 0); }
}
function blurH() {
  const t = new Float32Array(h);
  for (let y = 1; y < NY - 1; y++) for (let x = 1; x < NX - 1; x++) {
    const k = IX(x, y);
    h[k] = (t[k] * 4 + t[k - 1] + t[k + 1] + t[k - NX] + t[k + NX]) / 8;
  }
}
function arcWall(cx, cy, r, a0, a1, rad, hgt) {
  const n = Math.ceil(Math.abs(a1 - a0) * r * 3);
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); bump(cx + Math.cos(a) * r, cy + Math.sin(a) * r, rad, hgt, 0); }
}

// ============================================================
//  Layout of a round
// ============================================================
const L = {
  seatA: { x: 45.5, y: SEAT_ROW }, seatB: { x: 54.5, y: SEAT_ROW }, tray: { x: 50, y: SEAT_ROW + 0.7 },
  houseC: { x: 50, y: 70.5 }, wallR: 8.6,
  lump: { x: 38.6, y: 63.4 },
  funnelLump: { x: 31.8, y: 55.2 }, funnelGoal: { x: 28.6, y: 60.6 },
  ridge1: [19.8, 52.5, 25.2, 62.0],
  hollow: { x: 27.6, y: 67.0 }, hollowR: 4.0,
  backC: { x: 50, y: 37 },
  playRect: [17, 62, 33, 90],
};

let R = null; // round state
let roundN = 0;

function newRoundState() {
  return {
    seats: [
      { x: L.seatA.x, y: L.seatA.y, sit: 0, exp: 1, sitting: false, t: 0, cover: 1, look: [0, 0], lookT: 0, sip: 0, wig: 0, hat: 0 },
      { x: L.seatB.x, y: L.seatB.y, sit: 0, exp: 1, sitting: false, t: 0, cover: 1, look: [0, 0], lookT: 0, sip: 0, wig: 0, hat: 1 }],
    house: null, collectDone: false, collectT: 0, slideDone: false, slides: 0, pileMoved: false,
    whistleTime: 0, closedT: 0, finale: -1, demoShown: {}, roundT: 0, closeCheckT: 0, gaps: null,
    toast: 0, everOpen: false, eaveDone: false, stageT: {}
  };
}

function buildRound(prev) {
  const seed = (rnd() * 1000) | 0;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const k = IX(x, y);
    h[k] = 0.46 + 0.10 * (vnoise(x * 0.13, y * 0.13, seed) - 0.5) + 0.05 * (vnoise(x * 0.4, y * 0.4, seed + 77) - 0.5);
    noiseF[k] = (hash(x * 7 + seed, y * 13) - 0.5) * 0.05;
    const e = Math.min(x, y, NX - 1 - x, NY - 1 - y);
    if (e < 6) { const t = e / 6; h[k] = lerp(0.46, h[k], t); noiseF[k] *= t; }
    prot[k] = 0; inter[k] = 0; domeH[k] = 0; noDome[k] = 0; oldGlow[k] = 0; dep[k] = 0; touchF[k] = 0;
  }
  const v = (rnd() - 0.5) * 0.3; // small variation of amounts
  // half-built wall upwind of the seats (gap above seat A, ends before seat B)
  arcWall(L.houseC.x, L.houseC.y, L.wallR, -2.0, -1.40, 1.9, 2.7 + v);
  // the big snow end next to the gap — the first thing to stroke
  bump(L.lump.x, L.lump.y, 3.6, 2.6 + v, 1);
  // a ridge and a lump that can make a funnel toward the hollow
  ridgeLine(L.ridge1[0], L.ridge1[1], L.ridge1[2], L.ridge1[3], 1.8, 1.7);
  bump(L.funnelLump.x, L.funnelLump.y, 3.3, 2.7 + v, 1);
  // the hollow
  {
    const c = L.hollow, r = L.hollowR;
    for (let y = Math.floor(c.y - r * 1.4); y <= c.y + r * 1.4; y++) for (let x = Math.floor(c.x - r * 1.4); x <= c.x + r * 1.4; x++) {
      const d = Math.hypot(x - c.x, y - c.y) / r; if (d >= 1.35) continue; const k = IX(x, y);
      if (d >= 1) { h[k] += 0.16 * Math.sin((d - 1) / 0.35 * Math.PI); continue; }
      h[k] = Math.max(0.05, h[k] - 0.42 * (0.5 + 0.5 * Math.cos(d * Math.PI)));
    }
  }
  // the back garden: the previous house or the standard half-circle wall
  let placed = false;
  if (prev) placed = placeOldHouse(prev);
  if (!placed) arcWall(L.backC.x, L.backC.y + 3, 8.5, -Math.PI, 0, 1.8, 2.4);
  blurH();
  for (let y = 0; y < 48; y++) for (let x = 0; x < NX; x++) prot[IX(x, y)] |= 4;
  // seat zone
  for (const s of [L.seatA, L.seatB, L.tray]) {
    for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) {
      const k = cellAt(s.x + x, s.y + y); if (k < 0) continue;
      if (Math.hypot(x, y) <= 3.2) { prot[k] |= 1; h[k] = Math.min(h[k], 0.45); }
    }
  }
  R = newRoundState(); roundN++;
  for (const p of packets) p.dead = true; packets.length = 0;
  solveWind(260); computeShelter();
  terrainDirty = true;
}

// ============================================================
//  Persistence (simplified house shape only)
// ============================================================
const SKEY = 'kazeKamakura.house.v1';
let storageOK = true;
function loadHouse() {
  let raw = null;
  try { raw = window.localStorage.getItem(SKEY); } catch (e) { storageOK = false; return null; }
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || d.v !== 1) return null;
    const w = d.w, hh = d.h;
    if (!Number.isInteger(w) || !Number.isInteger(hh) || w < 4 || hh < 4 || w > 26 || hh > 26) return null;
    if (!Array.isArray(d.z) || d.z.length !== w * hh || !Array.isArray(d.g) || d.g.length !== w * hh) return null;
    for (let i = 0; i < d.z.length; i++) { const z = d.z[i]; if (!Number.isInteger(z) || z < 0 || z > 60) return null; const g = d.g[i]; if (g !== 0 && g !== 1) return null; }
    return { w, h: hh, z: d.z.slice(), g: d.g.slice() };
  } catch (e) { return null; }
}
function saveHouse(shape) {
  if (!shape) return;
  try { window.localStorage.setItem(SKEY, JSON.stringify({ v: 1, w: shape.w, h: shape.h, z: shape.z, g: shape.g })); storageOK = true; }
  catch (e) { storageOK = false; }
}
let memHouse = null; // in-memory fallback
function captureHouse() {
  const H = R.house; if (!H) return null;
  let x0 = NX, x1 = 0, y0 = NY, y1 = 0;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const k = IX(x, y); if (inter[k] || (prot[k] & 2)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 <= x0) return null;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(NX - 1, x1 + 1); y1 = Math.min(NY - 1, y1 + 1);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const sc = Math.min(1, 24 / bw, 19 / bh);
  const w = clamp(Math.round(bw * sc), 4, 26), hh = clamp(Math.round(bh * sc), 4, 26);
  const z = [], g = [];
  for (let j = 0; j < hh; j++) for (let i = 0; i < w; i++) {
    const wx = x0 + (i + 0.5) / w * bw - 0.5, wy = y0 + (j + 0.5) / hh * bh - 0.5;
    const k = cellAt(wx, wy);
    z.push(clamp(Math.round(sampleH(Hs, wx, wy) * 10), 0, 60));
    g.push(k >= 0 && (cutF[k] || flagF[k] === 2) ? 1 : 0);
  }
  return { w, h: hh, z, g };
}
function placeOldHouse(s) {
  if (!s) return false;
  const ox = Math.round(L.backC.x - s.w / 2), oy = Math.round(L.backC.y + 2 - s.h / 2);
  for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) {
    const k = cellAt(ox + i, oy + j); if (k < 0) continue;
    const z = s.z[j * s.w + i] / 10;
    h[k] = Math.max(h[k], Math.min(z, 5.4));
    if (s.g[j * s.w + i]) { oldGlow[k] = 1; h[k] = Math.min(h[k], 0.6); }
  }
  return true;
}

// ============================================================
//  Wind: potential flow around the snow + upwind shelter
// ============================================================
function updateConductivity() {
  for (let k = 0; k < N; k++) { const z = h[k]; kc[k] = z < 0.75 ? 1 : z > 1.4 ? 0.02 : lerp(1, 0.02, (z - 0.75) / 0.65); }
}
function solveWind(iter) {
  updateConductivity();
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) if (x === 0 || y === 0 || x === NX - 1 || y === NY - 1) phi[IX(x, y)] = -(WD[0] * x + WD[1] * y);
  for (let it = 0; it < iter; it++) {
    for (let y = 1; y < NY - 1; y++) {
      let k = y * NX + 1;
      for (let x = 1; x < NX - 1; x++, k++) {
        const c = kc[k];
        const ke = 2 * c * kc[k + 1] / (c + kc[k + 1]), kw = 2 * c * kc[k - 1] / (c + kc[k - 1]);
        const kn = 2 * c * kc[k - NX] / (c + kc[k - NX]), ks = 2 * c * kc[k + NX] / (c + kc[k + NX]);
        const s = ke + kw + kn + ks;
        const t = (ke * phi[k + 1] + kw * phi[k - 1] + kn * phi[k - NX] + ks * phi[k + NX]) / s;
        phi[k] += 1.75 * (t - phi[k]);
      }
    }
  }
  for (let y = 1; y < NY - 1; y++) for (let x = 1; x < NX - 1; x++) {
    const k = IX(x, y), c = kc[k];
    const ke = 2 * c * kc[k + 1] / (c + kc[k + 1]), kw = 2 * c * kc[k - 1] / (c + kc[k - 1]);
    const kn = 2 * c * kc[k - NX] / (c + kc[k - NX]), ks = 2 * c * kc[k + NX] / (c + kc[k + NX]);
    const ux = -0.5 * (ke * (phi[k + 1] - phi[k]) + kw * (phi[k] - phi[k - 1]));
    const uy = -0.5 * (ks * (phi[k + NX] - phi[k]) + kn * (phi[k] - phi[k - NX]));
    vx[k] = ux; vy[k] = uy; spd[k] = Math.hypot(ux, uy);
  }
  for (let x = 0; x < NX; x++) { for (const y of [0, NY - 1]) { const k = IX(x, y); vx[k] = WD[0]; vy[k] = WD[1]; spd[k] = 1; } }
  for (let y = 0; y < NY; y++) { for (const x of [0, NX - 1]) { const k = IX(x, y); vx[k] = WD[0]; vy[k] = WD[1]; spd[k] = 1; } }
}
function computeShelter() {
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const k = IX(x, y), h0 = h[k]; let s = 0;
    for (let d = 1; d <= 13; d++) {
      const hx = x - WD[0] * d, hy = y - WD[1] * d; if (hy < 0) break;
      const z = sampleH(h, hx, hy) - h0 - 0.06 * d;
      if (z > s) s = z;
    }
    shel[k] = clamp(s / 1.0, 0, 1);
  }
  // basin depth: how far below the local surroundings (radius 4)
  const r = 4;
  for (let y = 0; y < NY; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += h[IX(clamp(x, 0, NX - 1), y)]; for (let x = 0; x < NX; x++) { tmpA[IX(x, y)] = acc / (2 * r + 1); acc += h[IX(Math.min(NX - 1, x + r + 1), y)] - h[IX(Math.max(0, x - r), y)]; } }
  for (let x = 0; x < NX; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmpA[IX(x, clamp(y, 0, NY - 1))]; for (let y = 0; y < NY; y++) { const k = IX(x, y); basin[k] = Math.max(0, Math.min(acc / (2 * r + 1), 0.46) - h[k]); acc += tmpA[IX(x, Math.min(NY - 1, y + r + 1))] - tmpA[IX(x, Math.max(0, y - r))]; } }
}
function windAt(x, y, out) {
  if (x < 0 || y < 0 || x > NX - 1 || y > NY - 1) { out[0] = WD[0]; out[1] = WD[1]; out[2] = 1; out[3] = 0; return out; }
  out[0] = sampleH(vx, x, y); out[1] = sampleH(vy, x, y); out[2] = sampleH(spd, x, y); out[3] = sampleH(shel, x, y);
  return out;
}
const tmpW = [0, 0, 0, 0];
function effSpeed(x, y) { windAt(x, y, tmpW); return tmpW[2] * (1 - 0.8 * tmpW[3]); }

// ============================================================
//  Canvas, camera, safe area
// ============================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 10, q = 2, bw = 0, bh = 0;
const cam = { x: 36, y: 40, s: 10, tx: 36, ty: 40, ts: 10 };
let safe = { t: 0, r: 0, b: 0, l: 0 };
let bufA, bufB, imgA, imgB, cA, cB, cAx, cBx;
function readSafe() {
  const el = document.getElementById('sa'); const cs = getComputedStyle(el);
  safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  readSafe();
  q = Math.max(1.6, Math.sqrt(W * H / 105000));
  bw = Math.ceil(W / q); bh = Math.ceil(H / q);
  cA = document.createElement('canvas'); cA.width = bw; cA.height = bh; cAx = cA.getContext('2d');
  cB = document.createElement('canvas'); cB.width = bw; cB.height = bh; cBx = cB.getContext('2d');
  imgA = cAx.createImageData(bw, bh); imgB = cBx.createImageData(bw, bh);
  bufA = new Uint32Array(imgA.data.buffer); bufB = new Uint32Array(imgB.data.buffer);
  setCamTarget(true);
  terrainDirty = true;
}
function fitRect(x0, x1, y0, y1) {
  const aw = Math.max(50, W - safe.l - safe.r - 8), ah = Math.max(50, H - safe.t - safe.b - 8);
  const s = Math.min(aw / (x1 - x0), ah / ((y1 - y0) * K + 3));
  const cxs = safe.l + aw / 2 + 4, cys = safe.t + ah / 2 + 4;
  return { s, x: (x0 + x1) / 2 - (cxs - W / 2) / s, y: ((y0 + y1) / 2) * K - 1.2 - (cys - H / 2) / s };
}
function setCamTarget(snap) {
  let r;
  if (R && R.finale >= 0 && R.finale > 1.8) r = fitRect(14, 86, 22, 100);
  else if (R && R.house && R.house.done) { const b = R.house.bbox; r = fitRect(Math.min(b[0] - 8, 36), Math.max(b[1] + 8, 64), b[2] - 9, b[3] + 7); }
  else {
    const p = L.playRect;
    if (W < H * 0.8) { // portrait phone: frame a narrower strip around what matters now
      const f = target ? (target.x * 0.6 + L.houseC.x * 0.4) : L.houseC.x - 2;
      const half = 16, cx = clamp(f, p[0] + half, p[1] - half);
      r = fitRect(cx - half, cx + half, p[2] + 6, p[3] - 4);
    } else r = fitRect(p[0], p[1], p[2], p[3]);
  }
  cam.tx = r.x; cam.ty = r.y; cam.ts = r.s;
  if (snap) { cam.x = r.x; cam.y = r.y; cam.s = r.s; }
}
function proj(x, y, z, out) {
  out = out || [0, 0];
  out[0] = (x - cam.x) * cam.s + W / 2;
  out[1] = (y * K - z * HK - cam.y) * cam.s + H / 2;
  return out;
}
function surfZ(x, y) { return sampleH(Hs, x, y); }
function pick(sx, sy) {
  const wx = cam.x + (sx - W / 2) / cam.s;
  const tgt = (sy - H / 2) / cam.s + cam.y;
  const yFront = (tgt + 0.5) / K + 1;
  let prevY = yFront, prevD = 0;
  for (let wy = yFront; wy > -12; wy -= 0.2) {
    const d = wy * K - surfZ(wx, wy) * HK - tgt;
    if (d <= 0) {
      const t = prevD > 0 ? prevD / (prevD - d) : 0;
      return { x: wx, y: lerp(prevY, wy, t) };
    }

  const moving = Math.abs(cam.x - cam.tx) > 0.01 || Math.abs(cam.y - cam.ty) > 0.01 || Math.abs(cam.s - cam.ts) > 0.005;

    windG.gain.setTargetAtTime(0.035 + 0.035 * gust, t, 0.3); windBP.frequency.setTargetAtTime(380 + 260 * gust, t, 0.3);
    const H0 = R.house;
    if (H0) { setWhistle(0, H0.wins[0].f, H0.wins[0].g); setWhistle(1, H0.wins[1].f, H0.wins[1].g); }

let terrainAcc = 0;

  drawOverhangs();
  drawWorldOverlays(dt);
  drawFlakes();
  drawTarget(dt);
  drawDemo(dt);
  drawRipples(dt);
  if (gapWh.g > 0.01 && !(H0 && H0.lit)) {

    ctx.globalAlpha = clamp(gapWh.g * 12, 0, 0.9);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, cam.s * 0.15);

  }
  if (veil > 0.001) {
    ctx.globalAlpha = veil * 0.92; ctx.fillStyle = '#eef4f9'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = veil; ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) { const x = (hash(i, 3) * W + globalT * 20 * (0.5 + hash(i, 5))) % W, y = (hash(i, 7) * H + globalT * 60 * (0.5 + hash(i, 9))) % H; ctx.beginPath(); ctx.arc(x, y, 2 + hash(i, 11) * 3, 0, 6.283); ctx.fill(); }

//  Boot

draw(0.016);

  get gapWh() { return gapWh; }, get ptr() { return ptr; }, get AC() { return AC; }, get demo() { return demo; },
