(function(){
'use strict';
/* =========================================================
   どろり、すぽん！どうろの下にもういっぽん
   ひとつのファイルで完結。外部通信なし。
   ========================================================= */
var cv=document.getElementById('c'), cx=cv.getContext('2d'), saEl=document.getElementById('sa');

/* ---------- 世界の寸法（ワールド座標） ---------- */
var U=300, L=392, CW=5, NU=88, UX0=80, UX1=520, DIV=42, H0=75, H1=77, HOLEX=462.5;
var AF=310, BF=330;              // A型/B型（木型の上）の底
var TX0=296, NT=44, TFL=402, TCAP=10, TC=33; // 下型（トレー）
var CAPY=280;                    // 上の型わくで積める最上面
var FF=8, FH=19;                 // 伸びる厚み（空型／固まった道の上）
var GCAP=150, SHAFTCAP=150, TFULL=NT*TCAP*0.95;
var MY=204, MAXA=175, MBX0=390;
var RATE0=170;
var WX0=0, WX1=600, WY0=58, WY1=478;

/* ---------- 画面 ---------- */
var VW=0,VH=0,DPR=1,S=1,OX=0,OY=0,BR=50,CAM={x:null,aw:1,sl:0,visW:600};
function resize(){
  VW=window.innerWidth; VH=window.innerHeight; DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(VW*DPR)); cv.height=Math.max(1,Math.round(VH*DPR));
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  var cs=getComputedStyle(saEl);
  var st=parseFloat(cs.paddingTop)||0, sr=parseFloat(cs.paddingRight)||0, sb=parseFloat(cs.paddingBottom)||0, sl=parseFloat(cs.paddingLeft)||0;
  var aw=Math.max(100,VW-sl-sr), ah=Math.max(100,VH-st-sb);
  var S0=Math.min(aw/(WX1-WX0), ah/(WY1-WY0));
  var Z=1; if(aw<ah){ Z=clamp(1+(ah/aw-1)*0.45,1,1.5); }
  S=S0*Z; CAM.aw=aw; CAM.sl=sl; CAM.visW=aw/S;
  if(CAM.x==null) CAM.x=200;
  CAM.x=clamp(CAM.x,Math.min(300,CAM.visW/2),Math.max(300,600-CAM.visW/2));
  OX=sl+aw/2-CAM.x*S;
  var extra=ah-(WY1-WY0)*S;
  OY=st+extra*0.62 - WY0*S;
  BR=Math.max(50, 42/S);           // 押し板の半径（直径は常に84px以上）
}
function toWorld(px,py){return {x:(px-OX)/S, y:(py-OY)/S};}

/* ---------- 小道具 ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function easeIn(t){t=clamp(t,0,1);return t*t;}
function rnd(a,b){return a+Math.random()*(b-a);}

/* ---------- 状態 ---------- */
function mkBasin(n,x0,fl){var b={n:n,x0:x0,floor:new Float32Array(n),hard:new Float32Array(n),wet:new Float32Array(n),
  cap:null,barrier:null,mode:'idle',modeT:0,pourT:0,flash:0,isHole:null};
  for(var i=0;i<n;i++) b.floor[i]=fl(i); return b;}
var up=mkBasin(NU,UX0,function(i){return i<DIV?AF:BF;});
up.cap=new Float32Array(NU); for(var ci=0;ci<NU;ci++) up.cap[ci]=up.floor[ci]-CAPY;
up.barrier={}; up.barrier[DIV-1]=U;
up.ends=function(i){return i<=1||i===DIV-1||i===DIV||i>=NU-2;};
up.thin=function(i){return i<DIV?up.thinA:up.thinB;};
up.isHole=function(i){return i>=H0&&i<=H1&&(W.hole==='open'||W.hole==='plugging');};
var tray=mkBasin(NT,TX0,function(){return TFL;});
tray.thin=function(){return true;};tray.ends=function(i){return i<=1||i>=NT-2;};
tray.cap=new Float32Array(NT); for(ci=0;ci<NT;ci++) tray.cap[ci]=TCAP;

var G={L:{fill:0,spillT:0,wetT:0,hard:true,ride:false,flash:0},R:{fill:0,spillT:0,wetT:0,hard:true,ride:false,flash:0}};
var W={mouthB:false,mouthBAppear:0,mouthBX:MBX0,pulled:false,hole:'tube',shaft:0,plugBoard:0,panel:1,moldX:0,tubeY:0,
  fence:0,trayX:0,tunnelGlow:0,lamps:0,laps:0,loopDone:false,rim:0,rimFlash:0,carryPending:0,plugY:0,plugCore:0,
  drum:0,beacon:0,cycle:0,aConn:false,upConn:false};
var seq=null;
var pour={on:false,m:null,pid:null,hold:0,head:0,given:0,tail:null,soundT:0,chipT:0,impY:0,impX:0};
var boards={A:{p:0,v:0,press:false,wob:0},B:{p:0,v:0,press:false,wob:0}};
var expo={A:0,B:0};
var parts=[], PMAX=70;
var wob={truck:0,girl:0,wA:0,wB:0,formA:0,formB:0,tube:0};
var idleT=0, demo=null, demoDone=false, firstTouch=false, lastUse={A:0,B:0}, clock=0;
var girl={seg:'up',x:64,s:0,dir:1,v:0,wait:0,foot:true,through:false,side:'',y:U,face:1,ang:0,pedal:0,look:0,rideY:U,bellT:0};
var wA={x:200,y:AF,face:-1,tx:200,sweep:1,trowel:false,look:null,anim:0,arms:0,lean:0,sfxT:0,lock:false};
var wB={x:540,y:L,face:-1,tx:540,sweep:1,trowel:false,look:null,anim:0,arms:0,lean:0,sfxT:0,lock:false};

/* ---------- 斜路（受け溝） ---------- */
function cubic(p0,p1,p2,p3,n,out){for(var k=1;k<=n;k++){var t=k/n,u=1-t;
  out.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y});}}
function mkRamp(left){var pts=[];
  if(left){pts.push({x:80,y:U});cubic({x:80,y:U},{x:-8,y:U+8},{x:-22,y:L},{x:56,y:L},30,pts);}
  else{pts.push({x:520,y:U});cubic({x:520,y:U},{x:608,y:U+8},{x:622,y:L},{x:544,y:L},30,pts);}
  var acc=0;pts[0].s=0;for(var k=1;k<pts.length;k++){acc+=Math.hypot(pts[k].x-pts[k-1].x,pts[k].y-pts[k-1].y);pts[k].s=acc;}
  return {pts:pts,len:acc};}
var RL=mkRamp(true), RR=mkRamp(false);
function rampAt(r,s){s=clamp(s,0,r.len);var p=r.pts;for(var k=1;k<p.length;k++){if(p[k].s>=s){var a=p[k-1],b=p[k],t=(s-a.s)/Math.max(1e-6,b.s-a.s);
  return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),tx:b.x-a.x,ty:b.y-a.y};}}var e=p[p.length-1];return {x:e.x,y:e.y,tx:1,ty:0};}
function rampOff(s){return 7*Math.min(1,s/26)*Math.min(1,(RL.len-s)/26+0.3);} // 手前へずらす量

/* ---------- 保存 ---------- */
var SKEY='gf261111_road_v1', saveOK=true, saveT=-1;
function saveSoon(){saveT=0.6;}
function saveNow(){
  if(!saveOK) return;
  try{
    var a=[];for(var i=0;i<NU;i++) a.push(Math.round(up.hard[i]*10)/10);
    if(W.pulled){for(i=H0;i<=H1;i++) a[i]=0;}
    var d={v:1,up:a,gl:Math.round(G.L.fill*1000)/1000,gr:Math.round(G.R.fill*1000)/1000,p:W.pulled?1:0};
    localStorage.setItem(SKEY,JSON.stringify(d));
  }catch(e){saveOK=false;try{localStorage.removeItem(SKEY);}catch(e2){}}
}
function validSave(d){
  if(!d||typeof d!=='object'||d.v!==1) return false;
  if(!Array.isArray(d.up)||d.up.length!==NU) return false;
  for(var i=0;i<NU;i++){var h=d.up[i];if(typeof h!=='number'||!isFinite(h)||h<0||h>up.floor[i]-CAPY+0.01) return false;}
  if(typeof d.gl!=='number'||!isFinite(d.gl)||d.gl<0||d.gl>1) return false;
  if(typeof d.gr!=='number'||!isFinite(d.gr)||d.gr<0||d.gr>1) return false;
  if(d.p!==0&&d.p!==1) return false;
  return true;
}
function loadSave(){
  var raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){saveOK=false;return null;}
  if(raw==null) return null;
  var d=null;try{d=JSON.parse(raw);}catch(e){d=null;}
  if(!validSave(d)){try{localStorage.removeItem(SKEY);}catch(e){} return null;}
  return d;
}
function applySave(d){
  for(var i=0;i<NU;i++) up.hard[i]=d.up[i];
  G.L.fill=d.gl; G.R.fill=d.gr; G.L.ride=d.gl>=0.999; G.R.ride=d.gr>=0.999;
  if(d.p===1){W.pulled=true;W.hole='open';W.panel=0;W.moldX=999;W.tubeY=-999;W.fence=1;W.lamps=1;
    for(i=H0;i<=H1;i++) up.hard[i]=0; W.mouthB=true;W.mouthBAppear=1;W.mouthBX=HOLEX;}
  W.aConn=aConnected(); if(W.aConn){W.mouthB=true;W.mouthBAppear=1;}
}

/* ---------- 流れ（列モデル） ---------- */
function relax(B,Y,useF,dt){
  var n=B.n,fl=B.floor,hd=B.hard,wt=B.wet,k=Math.min(0.5,dt*16),cap=B.cap,bar=B.barrier,isH=B.isHole;
  var its=Y<1?8:4;
  for(var it=0;it<its;it++){
    var fwd=(it&1)===0;
    for(var q=0;q<n-1;q++){
      var i=fwd?q:n-2-q, j=i+1;
      var hi=isH?isH(i):false, hj=isH?isH(j):false;
      if(hi&&hj) continue;
      var Si=hi?-1e4:hd[i]+wt[i]-fl[i], Sj=hj?-1e4:hd[j]+wt[j]-fl[j];
      var s,d,Ss,Sd,hd_;
      if(Si>=Sj){s=i;d=j;Ss=Si;Sd=Sj;hd_=hj;}else{s=j;d=i;Ss=Sj;Sd=Si;hd_=hi;}
      if(wt[s]<0.01) continue;
      var diff=Ss-Sd, lim=wt[s];
      if(bar&&bar[i]!==undefined){var bS=-bar[i];if(Ss<=bS) continue;lim=Math.min(lim,Ss-bS);}
      var over=cap?(hd[s]+wt[s]-cap[s]):-1, m;
      if(hd_){ if(wt[s]<FF*0.5&&over<=0) continue; m=wt[s]*k; }
      else if(over>0.05){ m=Math.min(over,Math.max(0,diff)*0.5); }
      else{
        if(Y>50) continue;
        if(useF&&wt[d]<0.3){var bs=hd[s]-fl[s],bd=hd[d]-fl[d];var F=(hd[d]>2&&bd>bs-3&&!(B.thin&&B.thin(d)))?FH:FF; if(B.ends&&B.ends(d)&&F===FF) F=2.5;if(wt[s]<F) continue;}
        if(diff<=Y) continue;
        m=(diff-Y)*0.5*k;
      }
      m=Math.min(m,lim); if(m<=0) continue;
      wt[s]-=m;
      if(hd_) holeIn(m,false); else wt[d]+=m;
    }
  }
}
function basinStep(B,dt,isUp){
  if(B.pourT>0){B.pourT-=dt; if(B.mode!=='pour'){B.mode='pour';B.modeT=0;}}
  else if(B.mode==='pour'){B.mode='smooth';B.modeT=0;}
  B.modeT+=dt;
  var anyWet=false;for(var i=0;i<B.n;i++){if(B.wet[i]>0.02){anyWet=true;break;}}
  if(!anyWet&&B.mode!=='pour'){B.mode='idle';}
  if(B.mode==='smooth'&&B.modeT>1.5){B.mode='trim';B.modeT=0;}
  if(B.mode==='trim'&&B.modeT>0.5){B.mode='set';B.modeT=0;}
  if(B.mode==='set'&&B.modeT>3.0){harden(B,isUp);B.mode='idle';}
  var Y=B.mode==='pour'?3.2:B.mode==='smooth'?0.06:99;
  if(B.mode==='trim') edgeRamp(B);
  relax(B,Y,true,dt);
  if(B.flash>0) B.flash-=dt*1.5;
}
function edgeRamp(B){ // 端だけを坂にならす（上面の平らさは残す）
  var n=B.n,fl=B.floor,hd=B.hard,wt=B.wet,isH=B.isHole,bar=B.barrier;
  for(var pass=0;pass<60;pass++){var moved=false;
    for(var i=0;i<n-1;i++){var j=i+1; if(isH&&(isH(i)||isH(j))) continue; if(bar&&bar[i]!==undefined) continue;
      var Si=hd[i]+wt[i]-fl[i],Sj=hd[j]+wt[j]-fl[j],s=Si>Sj?i:j,d=s===i?j:i,st=Math.abs(Si-Sj);
      if(st>5.5&&wt[s]>0.05){var m=Math.min(wt[s],(st-5.5)/2);wt[s]-=m;wt[d]+=m;moved=true;}}
    if(!moved) break;}
}
function harden(B,isUp){
  var any=false;
  for(var i=0;i<B.n;i++){if(B.wet[i]>0.001){B.hard[i]+=B.wet[i];B.wet[i]=0;any=true;}}
  if(!any) return;
  B.flash=1; sHarden(qT());
  if(isUp){
    saveSoon();
    var was=W.aConn; W.aConn=aConnected();
    if(W.aConn&&!was&&!W.mouthB){W.mouthB=true;W.mouthBAppear=0;sChime([784,1047],qT());burst(MAXA+40,U-6,10,'star');girl.bellT=0.1;}
    var wasU=W.upConn; W.upConn=upConnected(); if(W.upConn&&!wasU){sChime([659,784,1047],qT());burst(300,U-10,12,'star');}
  }else{
    if(trayRide()){sChime([523,784,1047],qT());burst(HOLEX-60,L-8,10,'star');}
  }
}
function lips(dt){
  var k=Math.min(1,dt*10);
  var S0=up.hard[0]+up.wet[0]-up.floor[0];
  if(up.wet[0]>0.01&&S0>-U){var m=Math.min(up.wet[0],(S0+U)*k+0.02);up.wet[0]-=m;gutterIn(G.L,m);}
  var e=NU-1, Se=up.hard[e]+up.wet[e]-up.floor[e];
  if(up.wet[e]>0.01&&Se>-U){m=Math.min(up.wet[e],(Se+U)*k+0.02);up.wet[e]-=m;gutterIn(G.R,m);}
}
function gutterIn(g,m){ if(g.fill<1){g.fill=Math.min(1,g.fill+m/GCAP);g.hard=false;} g.spillT=0.3; g.wetT=0; }
function gutterStep(g,dt,side){
  if(g.spillT>0){g.spillT-=dt;} else {g.wetT+=dt;}
  if(!g.hard&&g.wetT>2.2){g.hard=true; if(g.fill>=0.999&&!g.ride){g.ride=true;g.flash=1;sChime([659,880,1175],qT());
      var p=rampAt(side<0?RL:RR,(side<0?RL:RR).len*0.5);burst(p.x,p.y,12,'star');girl.bellT=0.2;} else sHarden(qT()); saveSoon();}
  if(g.flash>0) g.flash-=dt*0.8;
}
function holeIn(amt,fromStream){
  if(trayFull()||W.hole==='plugging'){
    if(W.hole==='open'){W.hole='plugging';sKnock(qT());}
    W.shaft+=amt/SHAFTCAP;
    if(W.shaft>=1){var rest=(W.shaft-1)*SHAFTCAP;completePlug(); if(rest>0) depositUp(HOLEX,rest);}
  }else{
    tray.wet[TC-1]+=amt*0.25;tray.wet[TC]+=amt*0.5;tray.wet[TC+1]+=amt*0.25;tray.pourT=0.15;
  }
}
function completePlug(){
  W.hole='plugged';W.shaft=1;
  var h=(up.hard[H0-1]+up.hard[H1+1])/2;
  for(var i=H0;i<=H1;i++){up.hard[i]=h;up.wet[i]=0;}
  sChime([440,660,880],qT()); sSquee(); burst(HOLEX,U-10,10,'chip');
  saveSoon();
}
function depositUp(x,amt){
  var i=clamp(Math.floor((x-UX0)/CW),1,NU-2);
  var w=[0.25,0.5,0.25];
  for(var k=-1;k<=1;k++){var c=i+k,a=amt*w[k+1];
    if(up.isHole(c)) holeIn(a,true); else up.wet[c]+=a;}
  up.pourT=0.15;
}
function trayFull(){for(var i=0;i<NT;i++){if(tray.hard[i]+tray.wet[i]<9)return false;}return true;}
function trayTotal(){var s=0;for(var i=0;i<NT;i++) s+=tray.hard[i]+tray.wet[i];return s;}

/* ---------- 走れるかどうか ---------- */
var upY=new Float32Array(NU), lowY=new Float32Array(NT);
function colRide(B,i){return B.hard[i]>=4.5&&B.wet[i]<0.4;}
function computeRide(){
  for(var i=0;i<NU;i++){upY[i]=colRide(up,i)?up.floor[i]-up.hard[i]:NaN;}
  if(W.hole==='open'||W.hole==='plugging'){var a=upY[H0-1],b=upY[H1+1];var v=(!isNaN(a)&&!isNaN(b))?(a+b)/2:NaN;for(i=H0;i<=H1;i++) upY[i]=v;}
  var trOK=W.pulled&&!(seq&&seq.type==='carry')&&W.trayX===0;
  for(i=0;i<NT;i++){lowY[i]=(trOK&&colRide(tray,i))?TFL-tray.hard[i]:NaN;}
}
function aConnected(){computeRide();var prev=U;for(var i=0;i<DIV;i++){var y=upY[i];if(isNaN(y)||Math.abs(y-prev)>6.5) return false;prev=y;}return true;}
function upConnected(){computeRide();var prev=U;for(var i=0;i<NU;i++){var y=upY[i];if(isNaN(y)||Math.abs(y-prev)>6.5) return false;prev=y;}return Math.abs(prev-U)<=6.5;}
function trayRide(){computeRide();var prev=L;for(var i=0;i<NT;i++){var y=lowY[i];if(isNaN(y)||Math.abs(y-prev)>6.5) return false;prev=y;}return Math.abs(prev-L)<=6.5;}
function rideColUp(x){ if(x<UX0) return x>=44?U:NaN; if(x>=UX1) return x<=556?U:NaN; return upY[clamp(Math.floor((x-UX0)/CW),0,NU-1)]; }
function rideColLow(x){
  if(x<56||x>544) return NaN;
  if(!W.pulled&&x>=284&&x<=530) return NaN;
  if(x>=TX0&&x<TX0+NT*CW) return lowY[clamp(Math.floor((x-TX0)/CW),0,NT-1)];
  if(W.pulled&&(seq&&seq.type==='carry')&&x>=288&&x<=524) return NaN;
  return L;
}
function smoothY(fn,x){ var y0=fn(x); if(isNaN(y0)) return y0;
  var base=(x<UX0||x>=UX1)?0:0; var c=Math.floor((x-UX0)/CW); var fr=((x-UX0)/CW)-c-0.5;
  var y1=fn(x+(fr>0?CW:-CW)); if(isNaN(y1)) return y0; return lerp(y0,y1,Math.abs(fr)); }
function surfAll(x){ // 作業員用：生コン込みの面
  if(x<UX0||x>=UX1) return U;
  var i=clamp(Math.floor((x-UX0)/CW),0,NU-1);
  if(up.isHole(i)){ i = x<HOLEX? H0-1:H1+1; }
  return up.floor[i]-up.hard[i]-up.wet[i];
}
function surfLow(x){ if(W.pulled&&x>=TX0&&x<TX0+NT*CW&&W.trayX===0){var i=clamp(Math.floor((x-TX0)/CW),0,NT-1);return TFL-tray.hard[i]-tray.wet[i];} return L; }

/* ---------- 注ぎ口 ---------- */
function mouthX(m){return m==='A'?MAXA:W.mouthBX;}
function mouthOutY(){return MY+BR*0.46;}
function boardEnabled(m){ if(m==='A') return !(seq&&seq.type==='carry'&&seq.t<0.2); return W.mouthB&&W.mouthBAppear>=1&&!seq; }
function intoHole(m){return m==='B'&&(W.hole==='open'||W.hole==='plugging')&&Math.abs(W.mouthBX-HOLEX)<1;}
function impact(m){
  var x=mouthX(m);
  if(intoHole(m)){
    if(W.hole==='plugging') return {x:x,y:shaftTopY(),k:'shaft'};
    var i=clamp(Math.floor((x-TX0)/CW),0,NT-1); return {x:x,y:TFL-tray.hard[i]-tray.wet[i],k:'tray'};
  }
  var c=clamp(Math.floor((x-UX0)/CW),1,NU-2), y=1e9;
  for(var k=-1;k<=1;k++){var yy=up.floor[c+k]-up.hard[c+k]-up.wet[c+k]; if(yy<y) y=yy;}

function music(){
  if(!AC||AC.state!=='running') return;
  while(mNext<AC.currentTime+0.25){
    var st=mStep%16, bar=Math.floor(mStep/16)%4;
    if(st===0||st===8) tone(BAS[bar],0.45,'sine',0.5,mNext,null,mus);
    var mi=MEL[st]; if(mi>=0&&(bar!==3||st<8)) tone(PEN[(mi+bar)%PEN.length],0.25,'triangle',0.22,mNext,null,mus);
    if(st%4===2){var s=AC.createBufferSource();s.buffer=nb;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;var g=AC.createGain();env(g,mNext,0.003,0.05,0.08);s.connect(f);f.connect(g);g.connect(mus);s.start(mNext,Math.random());s.stop(mNext+0.08);}
    mNext+=STEP; mStep++;

}

function poke(p){
  sTick();
  var hit=null;
  if(p.x>20&&p.x<230&&p.y>70&&p.y<162) hit='truck';
  else if(Math.abs(p.x-girl.x)<22&&p.y>girl.y-46&&p.y<girl.y+6) hit='girl';
  else if(Math.abs(p.x-wA.x)<16&&p.y>wA.y-52&&p.y<wA.y+4) hit='wA';
  else if(Math.abs(p.x-wB.x)<16&&p.y>wB.y-52&&p.y<wB.y+4) hit='wB';
  else if(p.x>UX0&&p.x<290&&p.y>240&&p.y<320) hit='formA';
  else if(p.x>290&&p.x<UX1&&p.y>240&&p.y<410) hit='formB';
  if(hit) wob[hit]=0.45;
  if(parts.length<PMAX) parts.push({x:p.x,y:p.y,vx:0,vy:0,life:0.3,max:0.3,t:'ring'});
  if(hit==='girl') girl.look=0.8;
}

}

function mkPat(base,light,dark,wd){
  var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,64,64);g.lineCap='butt';
  g.strokeStyle=light;g.globalAlpha=0.45;g.lineWidth=wd||6;
  for(var k=-64;k<128;k+=32){g.beginPath();g.moveTo(k,64);g.lineTo(k+32,0);g.stroke();}
  g.strokeStyle=dark;g.globalAlpha=0.28;g.lineWidth=(wd||6)*0.6;
  for(k=-48;k<128;k+=32){g.beginPath();g.moveTo(k,64);g.lineTo(k+32,0);g.stroke();}
  return cx.createPattern(c,'repeat');
}

function ribbon(x,ya,yb,w,a){
  if(yb<=ya) return;
  cx.save();cx.globalAlpha=a;
  cx.beginPath();var n=8;
  for(var k=0;k<=n;k++){var y=lerp(ya,yb,k/n),off=Math.sin(clock*9+y*0.07)*1.6,ww=w*(0.85+0.15*Math.sin(y*0.2+clock*6));if(k===0)cx.moveTo(x-ww/2+off,y);else cx.lineTo(x-ww/2+off,y);}
  for(k=n;k>=0;k--){y=lerp(ya,yb,k/n);off=Math.sin(clock*9+y*0.07)*1.6;ww=w*(0.85+0.15*Math.sin(y*0.2+clock*6));cx.lineTo(x+ww/2+off,y);}
  cx.closePath();fillOut(P.wet,1.4);
  cx.strokeStyle='#a8b0b5';cx.globalAlpha=a*0.6;cx.lineWidth=2;cx.beginPath();cx.moveTo(x-w*0.2,ya);cx.lineTo(x-w*0.2+Math.sin(clock*7)*1.5,yb-4);cx.stroke();
  cx.restore();
}

/* ---------- 更新 ---------- */
function update(dt){
  clock+=dt;
  W.beacon+=dt*5; W.drum+=dt*(pour.on?4:1.4);
  if(W.mouthB&&W.mouthBAppear<1){var was=W.mouthBAppear;W.mouthBAppear=Math.min(1,W.mouthBAppear+dt*0.9);if(was<0.5&&W.mouthBAppear>=0.5)sKnock(qT());}
  if(W.tunnelGlow>0) W.tunnelGlow=Math.max(0,W.tunnelGlow-dt*0.7);
  if(W.rim>0&&W.rim<1) W.rim=Math.min(1,W.rim+dt*0.45);
  if(W.rimFlash>0) W.rimFlash=Math.max(0,W.rimFlash-dt*0.7);
  for(var k in wob) if(wob[k]>0) wob[k]=Math.max(0,wob[k]-dt);
  ['A','B'].forEach(function(m){var b=boards[m];var tgt=b.press?1:0;
    if(demo&&demo.m===m&&demo.t>0.45&&demo.t<0.95) tgt=0.55;
    var acc=(tgt-b.p)*620-b.v*24;b.v+=acc*dt;b.p+=b.v*dt;if(b.wob>0)b.wob-=dt;});
  pourStep(dt);
  up.thinA=false;up.thinB=false;
  for(var ii=0;ii<NU;ii++){if(up.isHole(ii)) continue; if(up.hard[ii]<4.5){if(ii<DIV)up.thinA=true;else up.thinB=true;}}
  basinStep(up,dt,true); lips(dt);
  if(W.pulled) basinStep(tray,dt,false);
  W.trayFullShown=trayFull();
  gutterStep(G.L,dt,-1); gutterStep(G.R,dt,1);
  seqStep(dt);
  // 木型を抜く条件：木型のてっぺんがすべて覆われ、固まった
  if(!seq&&!W.pulled&&!(pour.on&&pour.m==='B')&&!pour.tail){
    var ok=true;for(var i=DIV;i<NU;i++){if(up.hard[i]<7.5||up.wet[i]>0.05){ok=false;break;}}
    if(ok) startPull();
  }
  if(W.carryPending>0){W.carryPending-=dt;
    if(W.carryPending<=0){ var inT=girl.seg==='low'&&girl.x>270&&girl.x<545;
      if(seq||pour.on||inT||tray.mode!=='idle') W.carryPending=0.5; else {W.carryPending=0;startCarry();}}}
  computeRide();
  girlStep(dt); if(girl.look>0) girl.look-=dt;
  workerStep(wA,dt,'up'); workerStep(wB,dt,'low');
  partStep(dt);
  camStep(dt);
  // 手のお手本：約4秒さわらなければ一度だけ
  idleT+=dt;
  var tg=target();
  if(!demo&&!demoDone&&idleT>4&&tg&&!pour.on){demo={m:tg,t:0};demoDone=true;}
  if(demo){demo.t+=dt;if(demo.t>1.7) demo=null;}
  if(saveT>0){saveT-=dt;if(saveT<=0){saveT=-1;saveNow();}}
  music();
}

function camStep(dt){
  if(CAM.visW>=599){CAM.x=300;OX=CAM.sl+CAM.aw/2-CAM.x*S;return;}
  var fx;
  if(seq) fx=seq.type==='pull'?(seq.t<3.2?440:HOLEX):470;
  else if(pour.on) fx=intoHole(pour.m)?HOLEX:mouthX(pour.m)+40;
  else if(G.L.spillT>0) fx=120; else if(G.R.spillT>0) fx=480;
  else if(idleT>2.5&&target()) fx=mouthX(target())+(target()==='A'?40:0);
  else if(girl.v>1||girl.seg[0]==='r') fx=girl.x;
  else fx=CAM.fx!=null?CAM.fx:200;
  CAM.fx=fx;
  var lo=CAM.visW/2, hi=600-CAM.visW/2;
  var tx=clamp(fx,lo,hi);
  CAM.x+= (tx-CAM.x)*Math.min(1,dt*1.6);
  OX=CAM.sl+CAM.aw/2-CAM.x*S;
}
/* ---------- ループ ---------- */
var raf=0,last=0,running=false;
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05; if(dt<=0) return;
  update(dt); render();
}
function startLoop(){if(running) return;running=true;last=0;raf=requestAnimationFrame(frame);}
function stopLoop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stopPour();stopLoop();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{startLoop();try{if(AC&&AC.state!=='running')AC.resume();}catch(e){} if(AC) mNext=Math.max(mNext,AC.currentTime+0.1);}
});
window.addEventListener('pagehide',function(){stopPour();if(saveT>0)saveNow();});

/* ---------- 開始 ---------- */
resize(); mkPats();
var sv=loadSave(); if(sv) applySave(sv);
computeRide();
// テスト用の読み取り口（画面には何も出さない）
window.__dbg={W:W,up:up,tray:tray,G:G,girl:girl,pour:pour,boards:boards,target:target,
  world:function(x,y){return {x:OX+x*S,y:OY+y*S};},mouth:function(m){return {x:OX+mouthX(m)*S,y:OY+(MY+BR*0.1)*S,r:BR*S};},
  sim:function(sec){var n=Math.round(sec*60);for(var i=0;i<n;i++) update(1/60);render();},
  press:function(m){if(!pour.on&&boardEnabled(m)){startPour(m,-7);return true;}return false;},release:function(){stopPour();},
  get seq(){return seq;},get parts(){return parts.length;},get saveOK(){return saveOK;},get AC(){return AC?AC.state:'none';},get demo(){return demo;}};
startLoop();
})();
