<script>
(()=>{'use strict';
/* ============================================================
   うしろでぎゅっ！まがる電車の水あそび町  (gf-261111-nx5)
   world: 700 x 1100 (portrait). landscape = transposed view.
   ============================================================ */
const W=700,HT=1100,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const trailCv=document.createElement('canvas');trailCv.width=W;trailCv.height=HT;
const tctx=trailCv.getContext('2d');

/* ---------------- view ---------------- */
let vw=1,vh=1,dpr=1,S0=1,S=1,ox=0,oy=0,ox0=0,oy0=0,land=false,zoom=1,hf=1,time=0;
const sx=(x,y)=>land?ox+y*S:ox+x*S, sy=(x,y)=>land?oy+x*S:oy+y*S;
function toWorld(px,py){const u=(px-ox)/S,v=(py-oy)/S;return land?[v,u]:[u,v];}
function setW(c){if(land)c.setTransform(0,S*dpr,S*dpr,0,ox*dpr,oy*dpr);else c.setTransform(S*dpr,0,0,S*dpr,ox*dpr,oy*dpr);}
function setS(c){c.setTransform(dpr,0,0,dpr,0,0);}
function applyZoom(){S=S0*zoom;ox=vw/2+(ox0-vw/2)*zoom;oy=vh/2+(oy0-vh/2)*zoom;}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=Math.max(1,window.innerWidth);vh=Math.max(1,window.innerHeight);land=vw>vh;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  let st=0,sr=0,sb=0,sl=0;
  try{const cs=getComputedStyle(document.getElementById('sa'));
    st=parseFloat(cs.paddingTop)||0;sr=parseFloat(cs.paddingRight)||0;sb=parseFloat(cs.paddingBottom)||0;sl=parseFloat(cs.paddingLeft)||0;}catch(e){}
  const aw=vw-sl-sr,ah=vh-st-sb,ww=land?HT:W,wh=land?W:HT;
  S0=Math.min(aw/ww,ah/wh);ox0=sl+(aw-ww*S0)/2;oy0=st+(ah-wh*S0)/2;
  const z=zoom;zoom=1;applyZoom();buildBg();zoom=z;applyZoom();
}

/* ---------------- roads ---------------- */
// leader corridor = capsules(r). follower may use r+fx. br = needs raised bridge. fo = follower only pad.
const roads=[
 {ax:100,ay:150,bx:590,by:150,r:24,fx:26},   // top
 {ax:590,ay:150,bx:590,by:810,r:24,fx:26},   // right (ring + descent)
 {ax:100,ay:500,bx:590,by:500,r:24,fx:26},   // middle
 {ax:100,ay:150,bx:100,by:500,r:24,fx:26},   // left
 {ax:590,ay:810,bx:130,by:810,r:24,fx:26},   // lower
 {ax:100,ay:345,bx:180,by:345,r:26,fx:14},   // spur to the pond
 {ax:180,ay:345,bx:430,by:345,r:18,fx:4,br:1},// floating bridge
 {ax:430,ay:345,bx:478,by:340,r:18,fx:6,br:1},// pocket terrace
 {ax:478,ay:340,bx:492,by:288,r:18,fx:6,br:1},
 {ax:590,ay:150,bx:590,by:150,r:46,fx:16},   // wide corner 1
 {ax:590,ay:810,bx:590,by:810,r:46,fx:16},   // wide corner 2
 {ax:590,ay:500,bx:590,by:500,r:36,fx:18},
 {ax:100,ay:150,bx:100,by:150,r:38,fx:18},
 {ax:100,ay:500,bx:100,by:500,r:38,fx:18},
 {ax:552,ay:188,bx:552,by:188,r:20,fx:22,fo:1},// inside apron corner 1
 {ax:552,ay:772,bx:552,by:772,r:20,fx:22,fo:1},// inside apron corner 2
];
function clampRoad(x,y,fol,open){
  let best=1e9,rx=x,ry=y;
  for(let i=0;i<roads.length;i++){const s=roads[i];
    if(s.br&&!open)continue; if(s.fo&&!fol)continue;
    const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;
    let t=l2?((x-s.ax)*dx+(y-s.ay)*dy)/l2:0;t=t<0?0:t>1?1:t;
    const qx=s.ax+dx*t,qy=s.ay+dy*t,d=hyp(x-qx,y-qy),rr=s.r+(fol?s.fx:0);
    if(d<=rr)return null;
    const ov=d-rr;if(ov<best){best=ov;rx=qx+(x-qx)/d*rr;ry=qy+(y-qy)/d*rr;}
  }
  return [rx,ry];
}

/* ---------------- water network ---------------- */
const edges={};
function mkEdge(name,pts,to,cr){
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const e={name,pts,cum,len:cum[cum.length-1],to,cr:null,wet:0,flow:0};
  if(cr){let bt=0,bd=1e9;for(let t=0;t<=e.len;t+=2){const p=ptAt(e,t),d=hyp(p[0]-cr.x,p[1]-cr.y);if(d<bd){bd=d;bt=t;}}
    e.cr={x:cr.x,y:cr.y,t:bt,store:0,sill:cr.sill||0.3,branch:cr.branch||null,b:0,acc:0};}
  edges[name]=e;return e;
}
function ptAt(e,t){t=clamp(t,0,e.len);const c=e.cum,p=e.pts;let i=1;while(i<c.length-1&&c[i]<t)i++;
  const f=(t-c[i-1])/((c[i]-c[i-1])||1);return [lerp(p[i-1][0],p[i][0],f),lerp(p[i-1][1],p[i][1],f)];}
mkEdge('g1a',[[459,240],[300,240]],'G1');
mkEdge('g1b',[[300,240],[289,262],[300,290]],'P1');
mkEdge('g5',[[530,283],[530,560],[430,590],[330,590]],'K',{x:530,y:500});
mkEdge('sp1',[[330,403],[330,590]],'K',{x:330,y:500});
mkEdge('k',[[330,590],[292,622],[304,652]],'P2');
mkEdge('g2',[[459,710],[420,710]],'gate');
mkEdge('g2p',[[420,710],[334,694]],'P2');
mkEdge('g2t',[[420,710],[420,742]],'J');
mkEdge('g2d',[[420,742],[400,772],[400,862],[418,890]],'P3',{x:400,y:810,branch:'g2c'});
mkEdge('g2c',[[420,742],[352,760],[346,862],[353,897]],'P3',{x:346,y:810});
mkEdge('sp2',[[260,732],[262,860],[322,922]],'P3',{x:261,y:810});
mkEdge('sp3',[[345,958],[310,1000],[289,1010]],'tray');
mkEdge('ret',[[215,1050],[250,1064],[540,1066],[578,1036]],'tank');
const ponds={
 P1:{cx:330,cy:345,rx:92,ry:60,vol:0,cap:18,spill:'sp1',spAcc:0,disp:0,boats:[],shown:0,over:0},
 P2:{cx:260,cy:685,rx:75,ry:48,vol:0,cap:5,spill:'sp2',spAcc:0,disp:0,boats:[],shown:0,over:0},
 P3:{cx:410,cy:928,rx:90,ry:42,vol:0,cap:6,spill:'sp3',spAcc:0,disp:0,boats:[],shown:0,over:0},
};
const BRIDGE_AT=0.6;
const tray={cx:215,cy:1014,rx:75,ry:36,vol:0,cap:3,boats:[],shown:0};
const tank={x:592,y:1000,r:40,w:0};
const gate={g:0,pressed:false,pz:0};
const PLATE={x0:425,x1:535,y0:770,y1:850};
const MAXP=170;let packets=[];
function addWater(e,t,v){
  if(v<=0)return;
  for(let i=packets.length-1,n=0;i>=0&&n<40;i--,n++){const p=packets[i];if(p.e===e&&Math.abs(p.t-t)<9){p.v+=v;return;}}
  if(packets.length>=MAXP){let m=null;for(let i=packets.length-1;i>=0;i--)if(packets[i].e===e){m=packets[i];break;}
    if(!m)m=packets[packets.length-1];m.v+=v;return;}
  packets.push({e,t,v});
}
const disc=[0,0,0,0,0,0,0];const dacc=[0,0,0,0,0,0,0];
function arrive(e,v){
  const to=e.to,end=e.pts[e.pts.length-1];
  if(ponds[to]){const p=ponds[to];p.vol+=v;ripple(end[0],end[1],6);pondNote(p);
    if(e.name==='g1b')credit(1,v,end);
    if(e.name==='g2c')credit(4,v,end);
    if(e.name==='g2p')credit(3,v,end);
    if(e.name==='k')dacc[0]+=v;
  }else if(to==='tray'){tray.vol+=v;ripple(end[0],end[1]+8,5);}
  else if(to==='tank'){tank.w=Math.min(1,tank.w+v*0.3);}
  else if(to==='G1')addWater(edges.g1b,0,v);
  else if(to==='J')addWater(edges.g2d,0,v);
  else if(to==='K')addWater(edges.k,0,v);
  else if(to==='gate'){const g=gate.g;if(g>0.03)addWater(edges.g2p,0,v*g);if(g<0.97)addWater(edges.g2t,0,v*(1-g));}
}
function credit(i,v,at){dacc[i]+=v;const need=[0,0.3,0.4,0.3,0.2,0.3,0.15][i];
  if(!disc[i]&&dacc[i]>=need){disc[i]=1;dirty=true;celebrate(at[0],at[1],i);}}

/* ---------------- sponges ---------------- */
function mkSponge(cx,cy,hw,hh,outs){
  const N=44,rad=10,v=[];const per=2*(2*hw-2*rad)+2*(2*hh-2*rad)+TAU*rad;
  for(let i=0;i<N;i++){let d=per*i/N,x,y;const sw=2*hw-2*rad,sh=2*hh-2*rad,q=TAU*rad/4;
    if(d<sw){x=-hw+rad+d;y=-hh;}
    else if((d-=sw)<q){const a=-Math.PI/2+d/rad;x=hw-rad+Math.cos(a)*rad;y=-hh+rad+Math.sin(a)*rad;}
    else if((d-=q)<sh){x=hw;y=-hh+rad+d;}
    else if((d-=sh)<q){const a=d/rad;x=hw-rad+Math.cos(a)*rad;y=hh-rad+Math.sin(a)*rad;}
    else if((d-=q)<sw){x=hw-rad-d;y=hh;}
    else if((d-=sw)<q){const a=Math.PI/2+d/rad;x=-hw+rad+Math.cos(a)*rad;y=hh-rad+Math.sin(a)*rad;}
    else if((d-=q)<sh){x=-hw;y=hh-rad-d;}
    else{d-=sh;const a=Math.PI+d/rad;x=-hw+rad+Math.cos(a)*rad;y=-hh+rad+Math.sin(a)*rad;}
    v.push({rx:cx+x,ry:cy+y,x:cx+x,y:cy+y,vx:0,vy:0,px:cx+x,py:cy+y,hit:0});}
  const sp={cx,cy,hw,hh,v,outs,w:1,c:0,area0:0,pend:outs.map(()=>0),absorb:0,sq:0,u:0,ctx:cx,cty:cy,wob:0,pores:[]};
  sp.area0=polyArea(v,'rx','ry');
  for(let i=0;i<16;i++)sp.pores.push([cx+(((i*37)%17)/17-0.5)*hw*1.6,cy+(((i*53)%13)/13-0.5)*hh*1.6,1.6+(i%3)]);
  return sp;
}
function polyArea(v,kx,ky){let a=0;for(let i=0,n=v.length;i<n;i++){const p=v[i],q=v[(i+1)%n];a+=p[kx]*q[ky]-q[kx]*p[ky];}return Math.abs(a)/2;}
const sponges=[
 mkSponge(500,241,41,42,[{e:'g1a'},{e:'g5'}]),
 mkSponge(500,719,41,42,[{e:'g2'}]),
];
const SP_VOL=1.6,SP_CREF=0.15,PMAX=24;
// push a point out of a car rectangle through the face nearest the sponge body
const _po=[0,0,0,0,0];
function pushOut(vx,vy,c,hx,hy,sp){
  const dx=vx-c.x,dy=vy-c.y,lx=dx*c.cs+dy*c.sn,ly=-dx*c.sn+dy*c.cs;
  if(Math.abs(lx)>=hx||Math.abs(ly)>=hy)return null;
  const sdx=sp.cx-c.x,sdy=sp.cy-c.y,slx=sdx*c.cs+sdy*c.sn,sly=-sdx*c.sn+sdy*c.cs;
  let nlx=lx,nly=ly;
  if(Math.abs(slx)-hx>Math.abs(sly)-hy)nlx=slx>0?hx:-hx;else nly=sly>0?hy:-hy;
  const depth=Math.abs(nlx-lx)+Math.abs(nly-ly);
  const ex=(nlx-lx)*c.cs-(nly-ly)*c.sn,ey=(nlx-lx)*c.sn+(nly-ly)*c.cs;
  _po[0]=c.x+nlx*c.cs-nly*c.sn;_po[1]=c.y+nlx*c.sn+nly*c.cs;_po[2]=depth;_po[3]=ex/(depth||1);_po[4]=ey/(depth||1);
  return _po;
}

/* ---------------- train ---------------- */
const LA=46,LB=46,FHX=36,FHY=22,RHX=40,RHY=27;
const START={ax:566,ay:198.4,hx:525.3,hy:177,bx:479.4,by:174.3};
const tr={ax:0,ay:0,hx:0,hy:0,bx:0,by:0,grab:null,mode:1,spd:0,
 F:{x:0,y:0,cs:1,sn:0,sink:0,sv:0,wh:0,zo:0},R:{x:0,y:0,cs:1,sn:0,sink:0,sv:0,wh:0,zo:0},
 look:0,lugx:0,lugy:0,lvx:0,lvy:0,pvx:0,pvy:0,bell:0,moved:0};
function placeTrain(){Object.assign(tr,START);tr.grab=null;tr.mode=1;frames();}
function frames(){
  let dx=tr.ax-tr.hx,dy=tr.ay-tr.hy,l=hyp(dx,dy)||1;tr.F.x=tr.ax;tr.F.y=tr.ay;tr.F.cs=dx/l;tr.F.sn=dy/l;
  dx=tr.hx-tr.bx;dy=tr.hy-tr.by;l=hyp(dx,dy)||1;tr.R.x=tr.bx;tr.R.y=tr.by;tr.R.cs=dx/l;tr.R.sn=dy/l;
}
function carColl(c,hx,hy){ // returns push-back vector for the car against all sponges
  let px=0,py=0;
  for(const sp of sponges){
    if(Math.abs(c.x-sp.cx)>sp.hw+60||Math.abs(c.y-sp.cy)>sp.hh+60)continue;
    let md=0,ex=0,ey=0;
    for(const q of sp.v){const r=pushOut(q.rx,q.ry,c,hx,hy,sp);if(r&&r[2]>md){md=r[2];ex=r[3];ey=r[4];}}
    if(md>PMAX){px-=ex*(md-PMAX)*0.6;py-=ey*(md-PMAX)*0.6;}
  }
  return (px||py)?[px,py]:null;
}
function bridgeOpen(){return ponds.P1.vol>=ponds.P1.cap*BRIDGE_AT;}
function solve(fwd){
  const open=bridgeOpen();
  let lx=fwd?tr.ax:tr.bx,ly=fwd?tr.ay:tr.by,fx=fwd?tr.bx:tr.ax,fy=fwd?tr.by:tr.ay,hx=tr.hx,hy=tr.hy;
  const la=fwd?LA:LB,lb=fwd?LB:LA;
  const cl={x:0,y:0,cs:1,sn:0},cf={x:0,y:0,cs:1,sn:0};
  for(let it=0;it<4;it++){
    let dx=hx-lx,dy=hy-ly,d=hyp(dx,dy)||1;hx=lx+dx/d*la;hy=ly+dy/d*la;
    dx=fx-hx;dy=fy-hy;d=hyp(dx,dy)||1;fx=hx+dx/d*lb;fy=hy+dy/d*lb;
    const q=clampRoad(fx,fy,true,open);if(q){fx=q[0];fy=q[1];}
    dx=fx-lx;dy=fy-ly;d=hyp(dx,dy)||1;if(d<72){fx=lx+dx/d*72;fy=ly+dy/d*72;}
    // follower vs sponge
    dx=hx-fx;dy=hy-fy;d=hyp(dx,dy)||1;cf.x=fx;cf.y=fy;
    if(fwd){cf.cs=dx/d;cf.sn=dy/d;}else{cf.cs=-dx/d;cf.sn=-dy/d;}
    let pb=carColl(cf,fwd?RHX:FHX,fwd?RHY:FHY);if(pb){fx+=pb[0];fy+=pb[1];}
    dx=hx-fx;dy=hy-fy;d=hyp(dx,dy)||1;hx=fx+dx/d*lb;hy=fy+dy/d*lb;
    dx=lx-hx;dy=ly-hy;d=hyp(dx,dy)||1;lx=hx+dx/d*la;ly=hy+dy/d*la;
    const q2=clampRoad(lx,ly,false,open);if(q2){lx=q2[0];ly=q2[1];}
    dx=lx-hx;dy=ly-hy;d=hyp(dx,dy)||1;cl.x=lx;cl.y=ly;
    if(fwd){cl.cs=dx/d;cl.sn=dy/d;}else{cl.cs=-dx/d;cl.sn=-dy/d;}
    pb=carColl(cl,fwd?FHX:RHX,fwd?FHY:RHY);if(pb){lx+=pb[0];ly+=pb[1];}
  }
  let dx=hx-lx,dy=hy-ly,d=hyp(dx,dy)||1;hx=lx+dx/d*la;hy=ly+dy/d*la;
  dx=fx-hx;dy=fy-hy;d=hyp(dx,dy)||1;fx=hx+dx/d*lb;fy=hy+dy/d*lb;
  tr.hx=hx;tr.hy=hy;
  if(fwd){tr.ax=lx;tr.ay=ly;tr.bx=fx;tr.by=fy;}else{tr.bx=lx;tr.by=ly;tr.ax=fx;tr.ay=fy;}
  frames();
}
const ptr={id:null,x:0,y:0,offx:0,offy:0};
// Central gutter feedback never adds water or advances play.
const gutterTouch={id:null,life:0};
function drive(dt){
  const pax=tr.ax,pay=tr.ay,pbx=tr.bx,pby=tr.by;
  if(ptr.id!==null&&tr.grab){
    const w=ptr.wo||toWorld(ptr.x,ptr.y),G=tr.grab==='F'?tr.F:tr.R;
    let dx=w[0]+ptr.offx-G.x,dy=w[1]+ptr.offy-G.y;const d=hyp(dx,dy);
    if(d>1.2){
      const f=(dx*G.cs+dy*G.sn),lat=(-dx*G.sn+dy*G.cs);
      if(tr.grab==='F'){if(tr.mode>0){if(f<-0.55*d&&d>7)tr.mode=-1;}else if(f>-0.15*d)tr.mode=1;}
      else{if(tr.mode<0){if(f>0.55*d&&d>7)tr.mode=1;}else if(f<0.15*d)tr.mode=-1;}
      const fwd=tr.mode>0,st=Math.min(d*Math.min(1,dt*15),330*dt);
      const L=fwd?tr.F:tr.R,same=(fwd&&tr.grab==='F')||(!fwd&&tr.grab==='R');
      let mx,my;
      if(same){mx=dx/d*st;my=dy/d*st;}
      else{mx=(f*L.cs-lat*L.sn)/d*st;my=(f*L.sn+lat*L.cs)/d*st;}
      let nx=L.x+mx,ny=L.y+my;const q=clampRoad(nx,ny,false,bridgeOpen());if(q){nx=q[0];ny=q[1];}
      if(fwd){tr.ax=nx;tr.ay=ny;}else{tr.bx=nx;tr.by=ny;}
      solve(fwd);
    }
  }
  const mF=hyp(tr.ax-pax,tr.ay-pay),mR=hyp(tr.bx-pbx,tr.by-pby);
  const sgn=((tr.ax-pax)*tr.F.cs+(tr.ay-pay)*tr.F.sn)>=0?1:-1;
  if(mF+mR>0.3)tr.rev=sgn<0;tr.F.wh+=mF*sgn;tr.R.wh+=mR*sgn;tr.moved+=mF+mR;
  const sp=(mF+mR)/2/dt;tr.spd=lerp(tr.spd,sp,Math.min(1,dt*10));
  // driver looks into the turn (bend of the train + side motion)
  const bend=tr.F.cs*tr.R.sn-tr.F.sn*tr.R.cs;
  const lat=mF>0.05?(-(tr.ax-pax)*tr.F.sn+(tr.ay-pay)*tr.F.cs)/mF:0;
  tr.look=lerp(tr.look,clamp(-bend*1.6+lat*1.2,-1,1)*(tr.spd>8?1:0.4),Math.min(1,dt*6));
  // luggage sway
  const vx=(tr.bx-pbx)/dt,vy=(tr.by-pby)/dt,axl=(vx-tr.pvx),ayl=(vy-tr.pvy);tr.pvx=vx;tr.pvy=vy;
  const lx=-(axl*tr.R.cs+ayl*tr.R.sn)*0.02-vy*0.004*tr.R.cs,ly=-(-axl*tr.R.sn+ayl*tr.R.cs)*0.02+bend*tr.spd*0.03;
  tr.lvx+=(-140*tr.lugx-9*tr.lvx)*dt+lx;tr.lvy+=(-140*tr.lugy-9*tr.lvy)*dt+ly;
  tr.lugx=clamp(tr.lugx+tr.lvx*dt,-5,5);tr.lugy=clamp(tr.lugy+tr.lvy*dt,-5,5);
  for(const c of [tr.F,tr.R]){const held=(tr.grab&&((c===tr.F)===(tr.grab==='F')))?3.2:0;
    c.sv+=((held-c.sink)*320-c.sv*14)*dt;c.sink+=c.sv*dt;}
  // trails
  if(mF>0)trailAdd(0,tr.ax,tr.ay);if(mR>0)trailAdd(1,tr.bx,tr.by);
}

/* ---------------- trails / map ---------------- */
const TCOL=['#e8503a','#0e7a78'];
const trail=[[],[]],tlast=[null,null];let lastMap=[[],[]];
function trailAdd(i,x,y){
  const l=tlast[i];
  if(!l){tlast[i]=[x,y];trail[i].push(Math.round(x),Math.round(y));return;}
  if(hyp(x-l[0],y-l[1])<7)return;
  tctx.strokeStyle=TCOL[i];tctx.lineWidth=5;tctx.lineCap='round';tctx.globalAlpha=0.5;
  tctx.beginPath();tctx.moveTo(l[0],l[1]);tctx.lineTo(x,y);tctx.stroke();
  tlast[i]=[x,y];const a=trail[i];a.push(Math.round(x),Math.round(y));
  if(a.length>1200){const h=[];for(let k=0;k<600;k+=4)h.push(a[k],a[k+1]);trail[i]=h.concat(a.slice(600));}
  dirty=true;
}
function redrawTrails(){
  tctx.clearRect(0,0,W,HT);
  for(let i=0;i<2;i++){const a=trail[i];if(a.length<4)continue;
    tctx.strokeStyle=TCOL[i];tctx.lineWidth=5;tctx.lineCap='round';tctx.lineJoin='round';tctx.globalAlpha=0.5;
    tctx.beginPath();tctx.moveTo(a[0],a[1]);
    for(let k=2;k<a.length;k+=2){if(hyp(a[k]-a[k-2],a[k+1]-a[k-1])>90)tctx.moveTo(a[k],a[k+1]);else tctx.lineTo(a[k],a[k+1]);}
    tctx.stroke();}
}
function decim(a,n){if(a.length<=n*2)return a.slice();const o=[],st=Math.ceil(a.length/2/n);for(let k=0;k<a.length;k+=2*st)o.push(a[k],a[k+1]);return o;}

/* ---------------- kids & boats ---------------- */
const kids=[
 {x:402,y:410,src:'P1',need:()=>true,shirt:'#f2b632',hair:'#4a2e1a',pop:1},
 {x:414,y:274,src:'g1a',lt:34,need:()=>ponds.P1.vol>2.2,shirt:'#ef7a5a',hair:'#2a2420',pop:0},
 {x:514,y:970,src:'P3',need:()=>ponds.P3.vol>0.2||ponds.P1.vol>3.5,shirt:'#7fb7e6',hair:'#6b4423',pop:0},
 {x:440,y:686,src:'g2',lt:18,need:()=>ponds.P3.vol>1||ponds.P2.vol>1,shirt:'#9ccf5a',hair:'#3a2a1c',pop:0},
 {x:204,y:642,src:'P2',need:()=>picnic,shirt:'#f4f0e6',hair:'#59371f',pop:0},
];
const boats=kids.map((k,i)=>({kid:i,st:'hand',x:k.x,y:k.y,e:null,t:0,pond:null,fx:0,fy:0,ft:0,tx:0,ty:0,next:null,tilt:0,slot:0,z:0}));
kids.forEach((k,i)=>{k.i=i;k.jump=0;k.wob=0;k.lx=0;k.ly=1;});
function launchSpot(k){if(edges[k.src])return ptAt(edges[k.src],k.lt);const p=ponds[k.src];
  const dx=k.x-p.cx,dy=k.y-p.cy,d=hyp(dx/p.rx,dy/p.ry)||1;return [p.cx+dx/d*0.62,p.cy+dy/d*0.62];}
function flyBoat(b,tx,ty,next){b.st='fly';b.fx=b.x;b.fy=b.y;b.tx=tx;b.ty=ty;b.ft=0;b.next=next;}
function stepBoats(dt){
  for(const b of boats){const k=kids[b.kid];
    if(b.st==='hand'){b.x=k.x+9;b.y=k.y-2;
      if(k.pop>0.95&&!finale.on){
        let ok=false;
        if(edges[k.src])ok=edges[k.src].flow>0.02;
        else ok=ponds[k.src].vol>(k.src==='P1'?1.2:0.8);
        if(ok){const s=launchSpot(k);flyBoat(b,s[0],s[1],edges[k.src]?'edge':'pond');sfx.plop();}
      }
    }else if(b.st==='fly'){b.ft+=dt*2.2;const u=clamp(b.ft,0,1),e=u*u*(3-2*u);
      b.x=lerp(b.fx,b.tx,e);b.y=lerp(b.fy,b.ty,e);b.z=Math.sin(u*Math.PI)*26;
      if(u>=1){b.z=0;b.st=b.next;
        if(b.st==='edge'){b.e=edges[k.src];b.t=k.lt;}
        else if(b.st==='pond'){b.pond=ponds[k.src];b.pond.boats.push(b);ripple(b.x,b.y,8);}
        else if(b.st==='hand'){}
      }
    }else if(b.st==='edge'){
      const e=b.e;let go=false;
      for(let i=0;i<packets.length;i++){const p=packets[i];if(p.e===e&&p.t>b.t-46&&p.t<b.t+16){go=true;break;}}
      if(go){let nt=b.t+120*dt;const cr=e.cr;
        if(cr&&cr.b>0.5&&b.t<=cr.t-9)nt=Math.min(nt,cr.t-9);
        b.t=nt;b.tilt=lerp(b.tilt,0,dt*6);}
      else b.tilt=lerp(b.tilt,0.35,dt*3);
      if(b.t>=e.len){const to=e.to;
        if(ponds[to]){b.st='pond';b.pond=ponds[to];b.pond.boats.push(b);const q=ptAt(e,e.len);ripple(q[0],q[1],8);
          if(e.name==='g2c')kids[2].jump=1;}
        else if(to==='G1'){b.e=edges.g1b;b.t=0;}
        else if(to==='gate'){b.e=gate.g>0.5?edges.g2p:edges.g2t;b.t=0;}
        else if(to==='J'){const cr=edges.g2d.cr;b.e=(cr.b>=0.5&&cr.store>=cr.sill*0.8)?edges.g2c:edges.g2d;b.t=0;}
        else if(to==='K'){b.e=edges.k;b.t=0;}
        else if(to==='tray'){b.st='tray';b.slot=tray.boats.length;tray.boats.push(b);boatHome(b);}
        else {b.t=e.len;}
      }
      if(b.st==='edge'){const q=ptAt(b.e,b.t);b.x=q[0];b.y=q[1];}
    }else if(b.st==='pond'){const p=b.pond,i=p.boats.indexOf(b),k2=0.3+0.5*Math.sqrt(clamp(p.vol/p.cap,0,1));
      const a=i*2.3+time*0.12+b.kid,tx=p.cx+Math.cos(a)*p.rx*0.55*k2,ty=p.cy+(p===ponds.P1?(Math.sin(a)>0?1:-1)*p.ry*0.52*k2:Math.sin(a)*p.ry*0.5*k2);
      b.x=lerp(b.x,tx,dt*0.9);b.y=lerp(b.y,ty,dt*0.9);b.tilt=Math.sin(time*1.7+b.kid)*0.08;
    }else if(b.st==='tray'){const tx=tray.cx+(b.slot-1)*44,ty=tray.cy+4;b.x=lerp(b.x,tx,dt*3);b.y=lerp(b.y,ty,dt*3);b.tilt=Math.sin(time*1.4+b.slot)*0.06;}
  }
}
function boatHome(b){
  sfx.arrive(tray.boats.length);sparkle(tray.cx+(b.slot-1)*44,tray.cy,14);
  for(const k of kids)if(k.pop>0.5)k.jump=1;
  if(tray.boats.length>=3&&!finale.on)startFinale();
}
function stepKids(dt){
  for(const k of kids){
    if(k.pop<1&&k.need())k.pop=Math.min(1,k.pop+dt*1.6);
    if(k.jump>0)k.jump=Math.max(0,k.jump-dt*1.1);
    if(k.wob>0)k.wob=Math.max(0,k.wob-dt*2.2);
    const b=boats[k.i];let tx=tr.ax,ty=tr.ay;
    if(b.st!=='hand'&&b.st!=='tray'){tx=b.x;ty=b.y;}else if(guide.t){tx=guide.t.x;ty=guide.t.y;}
    const dx=tx-k.x,dy=ty-k.y,d=hyp(dx,dy)||1;k.lx=lerp(k.lx,dx/d,dt*4);k.ly=lerp(k.ly,dy/d,dt*4);
  }
}

const MAXQ=110;const parts=[];const rips=[];
function drop(x,y,vx,vy,vz,col){if(parts.length>=MAXQ)return;parts.push({x,y,z:6,vx,vy,vz,life:0.7,col:col||0});}
function ripple(x,y,r){if(rips.length>=14)rips.shift();rips.push({x,y,r,life:1});}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=40+Math.random()*70;drop(x,y,Math.cos(a)*s,Math.sin(a)*s,90+Math.random()*60,1);}}

/* ---------------- audio ---------------- */
let AC=null,master=null,roll=null,squish=null,flowN=null,lastNote=0,lastBub=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
    master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    const n=AC.sampleRate*2,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const loop=(type,f,q)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const fl=AC.createBiquadFilter();
      fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return {g,fl};};
    roll=loop('lowpass',190,0.7);squish=loop('bandpass',1000,2.5);flowN=loop('bandpass',2400,0.9);
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,delay,slide){
  if(!AC||AC.state!=='running')return;
  try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
const PENTA=[523,587,659,784,880,1047,1175,1319,1568];
const sfx={
  tap(){tone(150,0.16,'sine',0.5,0,0.6);tone(310,0.07,'triangle',0.12,0.01,0.7);},
  tick(){tone(420,0.07,'triangle',0.12,0,0.8);},
  plop(){tone(520,0.12,'sine',0.25,0,1.8);},
  clack(){tone(240,0.06,'square',0.1,0,0.6);tone(700,0.2,'triangle',0.1,0.05,0.75);},
  bridge(){[0,2,4,5].forEach((n,i)=>tone(PENTA[n]/2,0.5,'triangle',0.22,i*0.11));},
  disc(i){[0,2,4].forEach((n,j)=>tone(PENTA[(n+i)%9],0.42,'triangle',0.2,j*0.09));tone(PENTA[(4+i)%9]*2,0.6,'sine',0.1,0.3);},
  arrive(n){[0,2,4,5+n].forEach((q,j)=>tone(PENTA[Math.min(8,q)],0.38,'triangle',0.22,j*0.08));},
  fanfare(){[0,2,4,5,4,5,7].forEach((q,j)=>tone(PENTA[q],0.5,'triangle',0.22,j*0.16));[0,2,4].forEach(q=>tone(PENTA[q]/2,1.4,'sine',0.12,1.15));},
  splash(){if(!AC||AC.state!=='running')return;tone(900,0.35,'sine',0.14,0,0.3);tone(300,0.3,'triangle',0.16,0.02,0.5);},
};
function pondNote(p){ // success: water reached a pond. pitch climbs with the level
  if(time-lastNote<0.16)return;lastNote=time;
  const f=clamp(p.vol/p.cap,0,1),i=Math.min(8,Math.floor(f*8.99));
  tone(PENTA[i]*(p===ponds.P2?0.75:1),0.3,'sine',0.2,0,1);tone(PENTA[i]*2,0.18,'sine',0.05,0.02);
}
function audioFrame(dt,sq,ab,fl){
  if(!AC||AC.state!=='running')return;const t=AC.currentTime;
  try{
    roll.g.gain.setTargetAtTime(clamp(tr.spd/260,0,1)*0.2,t,0.05);roll.fl.frequency.setTargetAtTime(140+tr.spd*0.6,t,0.08);
    squish.g.gain.setTargetAtTime(clamp(sq*0.5+ab*0.22,0,0.5),t,0.03);
    squish.fl.frequency.setTargetAtTime(ab>sq?500+ab*500:800+sq*1300,t,0.04);
    flowN.g.gain.setTargetAtTime(clamp(fl*0.07,0,0.2),t,0.08);
  }catch(e){}
  if(fl>0.05&&time-lastBub>0.09&&Math.random()<fl*dt*9){lastBub=time;tone(500+Math.random()*900,0.07,'sine',0.05,0,1.5);}

const NODES=[[100,150],[590,150],[590,500],[100,500],[100,345],[185,345],[430,345],[490,300],[590,810],[140,810]];
const ADJ=[[0,1],[1,2],[2,3],[3,4],[4,0],[4,5],[5,6],[6,7],[2,8],[8,9]];
const guide={t:null,idle:0,shown:false,hand:null,touched:false,key:''};
function pickTarget(){
  const p1=ponds.P1,f1=p1.vol/p1.cap,open=bridgeOpen(),s1=sponges[0];
  const S1={k:'s1',x:s1.cx+22,y:s1.cy-22,r:54,car:'F',gx:tr.ay<205&&tr.ax<575?590:470,gy:tr.ay<205&&tr.ax<575?300:150};
  const S2={k:'s2',x:513,y:732,r:54,car:'F',gx:tr.ay<760?590:470,gy:tr.ay<760?(tr.ay<700?700:810):810};
  if(tr.ay>=760&&tr.ax<560){S2.gx=590;S2.gy=690;}
  if(finale.on||!guide.touched)return {k:'train',x:tr.ax,y:tr.ay,r:50,car:'F',gx:tr.ax+(tr.F.cs*120),gy:tr.ay+(tr.F.sn*120)};
  if(!disc[1]||f1<0.28)return S1;
  if(!disc[3])return {k:'plate',x:480,y:810,r:50,car:'F',gx:480,gy:800};
  if(!disc[4])return {k:'dam',x:400,y:810,r:40,car:'R',gx:400,gy:806};
  if(!open)return S1;
  if(!disc[5])return {k:'pocket',x:490,y:296,r:44,car:'F',gx:490,gy:300};
  if(f1<0.99)return S1;
  if(!disc[6])return {k:'bridge',x:330,y:345,r:48,car:'R',gx:330,gy:345};
  if(ponds.P2.vol<ponds.P2.cap*0.98)return {k:'plate',x:480,y:810,r:50,car:'F',gx:480,gy:800};
  return {k:'bridge',x:330,y:345,r:48,car:'R',gx:330,gy:345};
}
function route(sx0,sy0,gx,gy){
  const open=bridgeOpen(),near=(x,y)=>{let b=0,bd=1e9;NODES.forEach((n,i)=>{if(!open&&(i===6||i===7))return;const d=hyp(n[0]-x,n[1]-y);if(d<bd){bd=d;b=i;}});return b;};
  const s=near(sx0,sy0),g=near(gx,gy),prev=new Array(NODES.length).fill(-1),qu=[s];prev[s]=s;
  while(qu.length){const c=qu.shift();if(c===g)break;
    for(const a of ADJ){let o=-1;if(a[0]===c)o=a[1];else if(a[1]===c)o=a[0];
      if(o<0||prev[o]>=0)continue;if(!open&&(o===6||o===7))continue;prev[o]=c;qu.push(o);}}
  const mid=[];if(prev[g]>=0){let c=g;while(c!==s){mid.unshift(NODES[c]);c=prev[c];}mid.unshift(NODES[s]);}
  if(mid.length>=1){const n0=mid[0],n1=mid[1]||[gx,gy];if((n1[0]-n0[0])*(sx0-n0[0])+(n1[1]-n0[1])*(sy0-n0[1])>0)mid.shift();}
  if(mid.length>=1){const nl=mid[mid.length-1],np=mid[mid.length-2]||[sx0,sy0];if((np[0]-nl[0])*(gx-nl[0])+(np[1]-nl[1])*(gy-nl[1])>0)mid.pop();}
  return [[sx0,sy0]].concat(mid,[[gx,gy]]);
}
function stepGuide(dt){
  guide.t=pickTarget();
  if(ptr.id!==null){guide.idle=0;guide.shown=false;guide.hand=null;return;}
  guide.idle+=dt;
  if(guide.idle>4&&!guide.shown){guide.shown=true;
    const t=guide.t,c=t.car==='R'?tr.R:tr.F,pts=route(c.x,c.y,t.gx,t.gy),cum=[0];
    for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    guide.hand={pts,cum,len:Math.min(cum[cum.length-1],330),u:0};}
  if(guide.hand){guide.hand.u+=dt/2.4;if(guide.hand.u>=1)guide.hand=null;}
}
function celebrate(x,y,i){sfx.disc(i);sparkle(x,y,18);for(const k of kids)if(k.pop>0.5)k.jump=1;}

function okArr(a){return Array.isArray(a)&&a.length<=1300&&a.length%2===0&&a.every(n=>typeof n==='number'&&isFinite(n)&&n>=-50&&n<=1200);}
function load(){
  let o=null;
  try{const s=window.localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){o=null;}
  try{
    if(!o||typeof o!=='object'||o.v!==1)return;
    const num=(v,m)=>typeof v==='number'&&isFinite(v)&&v>=0&&v<=m;
    if(!num(o.p1,ponds.P1.cap+1)||!num(o.p2,ponds.P2.cap+1)||!num(o.p3,ponds.P3.cap+1)||!num(o.tv,10)||!num(o.lap,1e6))return;
    if(!Array.isArray(o.d)||o.d.length!==7)return;
    if(!Array.isArray(o.cur)||!Array.isArray(o.last)||!okArr(o.cur[0])||!okArr(o.cur[1])||!okArr(o.last[0])||!okArr(o.last[1]))return;
    ponds.P1.vol=Math.min(o.p1,ponds.P1.cap);ponds.P2.vol=Math.min(o.p2,ponds.P2.cap);ponds.P3.vol=Math.min(o.p3,ponds.P3.cap);tray.vol=Math.min(o.tv,tray.cap);
    lap=Math.floor(o.lap);picnic=!!o.pic;for(let i=0;i<7;i++)disc[i]=o.d[i]?1:0;
    trail[0]=o.cur[0].slice();trail[1]=o.cur[1].slice();lastMap=[o.last[0].slice(),o.last[1].slice()];
    redrawTrails();
    if(picnic)picT=1;bridgeWas=bridgeOpen();brT=bridgeWas?1:0;
    for(const n in ponds)ponds[n].shown=ponds[n].vol;tray.shown=tray.vol;
    if(disc[1]||ponds.P1.vol>0)for(const k of kids)if(k.need())k.pop=1;
  }catch(e){
    ponds.P1.vol=ponds.P2.vol=ponds.P3.vol=tray.vol=0;lap=0;picnic=false;for(let i=0;i<7;i++)disc[i]=0;trail[0]=[];trail[1]=[];lastMap=[[],[]];
    try{tctx.clearRect(0,0,W,HT);}catch(e2){}
  }
}

const trees=[[60,62,26],[232,56,22],[408,60,25],[655,292,24],[662,560,26],[36,650,24],[640,905,24],[470,1012,20],
 [-70,300,28],[770,470,28],[-80,800,26],[780,820,24],[150,-70,28],[520,-90,30],[330,-150,26],[120,1190,28],[540,1210,30],[330,1260,26],[-60,-40,26],[770,90,26],[-70,1100,26],[770,1120,28]].map(t=>({x:t[0],y:t[1],r:t[2],wob:0}));
const station={x:70,y:932,wob:0};
function wobbleAt(wx,wy){
  let best=null,bd=1e9;const tryp=(o,x,y,r)=>{const d=hyp(wx-x,wy-y);if(d<r&&d<bd){bd=d;best=o;}};
  for(const t of trees)tryp(t,t.x,t.y-t.r*0.4,t.r+10);
  for(const k of kids)if(k.pop>0.5)tryp(k,k.x,k.y-18,26);
  tryp(station,station.x,station.y-25,55);tryp(tank,tank.x,tank.y,tank.r+6);
  for(const sp of sponges)tryp(sp,sp.cx,sp.cy,50);
  for(const n in ponds)tryp(ponds[n],ponds[n].cx,ponds[n].cy,ponds[n].rx*0.9);
  tryp(tray,tray.cx,tray.cy,tray.rx*0.8);

function stepSponges(dt){

    let csx=0,csy=0,cw=0,any=false;
    const nearR=Math.abs(tr.R.x-sp.cx)<sp.hw+70&&Math.abs(tr.R.y-sp.cy)<sp.hh+70,nearF=Math.abs(tr.F.x-sp.cx)<sp.hw+70&&Math.abs(tr.F.y-sp.cy)<sp.hh+70;

      if(!r&&nearF)r=pushOut(q.rx,q.ry,tr.F,FHX,FHY,sp);

function carPts(c,hx,hy,z){const o=[],zz=z*S*hf;for(const q of [[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]]){const wx=c.x+q[0]*c.cs-q[1]*c.sn,wy=c.y+q[0]*c.sn+q[1]*c.cs;o.push([sx(wx,wy),sy(wx,wy)-zz]);}return o;}
function carP(c,lx,ly,z){const wx=c.x+lx*c.cs-ly*c.sn,wy=c.y+lx*c.sn+ly*c.cs;return [sx(wx,wy),sy(wx,wy)-z*S*hf];}
function deckZ(){const p=ponds.P1,f=clamp(p.shown/(p.cap*BRIDGE_AT),0,1);return -15*(1-f)+(p.shown>p.cap*BRIDGE_AT?2:0)-p.disp*7;}
function drawCar(c,rear){
  const zb=(c.zo>0.02?deckZ()*c.zo:0),sink=c.sink,z0=zb+7-sink*0.6,z1=zb+25-sink;

    const p=[carP(c,wx-10,wy-4,zb+3),carP(c,wx+10,wy-4,zb+3),carP(c,wx+10,wy+4,zb+3),carP(c,wx-10,wy+4,zb+3)];quad(ctx,p,'#26282b');

    for(let k=0;k<3;k++){const o=((c.wh*0.9+k*6.6)%20+20)%20-10;const a=carP(c,wx+o,wy-4,zb+3),b=carP(c,wx+o,wy+4,zb+3);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}ctx.stroke();}

  a=carP(c,-FHX+3,FHY-2.5,z1);b=carP(c,FHX-3,FHY-2.5,z1);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  if(!rear){

    const st=carP(c,16,0,z1+2);ctx.strokeStyle='#2a2a2a';ctx.lineWidth=2.6*S;ctx.beginPath();ctx.arc(st[0],st[1],6*S,0,TAU);ctx.stroke();

    const bd=carP(c,-3,0,z1+3);ctx.fillStyle='#2f5fb5';ctx.beginPath();ctx.ellipse(bd[0],bd[1],11*S,9*S,0,0,TAU);ctx.fill();
    const lk=tr.look,hd=carP(c,1+Math.abs(lk)*1,lk*5,z1+13);
    ctx.fillStyle='#f1c9a5';ctx.beginPath();ctx.arc(hd[0],hd[1],8.2*S,0,TAU);ctx.fill();

    c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1.5;c.beginPath();c.arc(tank.x,tank.y,(tank.r-14)*(0.6+0.3*Math.sin(time*2+tank.w*4)),0,TAU);c.stroke();}

  // plate, link rod and water gate
  {const d=gate.pz;c.strokeStyle='#6b5a3a';c.lineWidth=3;c.beginPath();c.moveTo(430,768);c.lineTo(418,744);c.lineTo(413,722);c.stroke();
    c.fillStyle=d>0.5?'#a9793f':'#c9965a';c.strokeStyle='#6b4a22';c.lineWidth=2;c.beginPath();c.roundRect(PLATE.x0-6,768+d*2,PLATE.x1-PLATE.x0+12,88,6);c.fill();c.stroke();

    else{ // parasol + basket
      const X=sx(478,612),Y=sy(478,612),s=S*picT;c.save();c.translate(X,Y);c.scale(s,s);
      c.strokeStyle='#7a5a34';c.lineWidth=2.5;c.beginPath();c.moveTo(0,0);c.lineTo(0,-40*hf-6);c.stroke();
      const py=-40*hf-6;for(let i=0;i<6;i++){c.fillStyle=i%2?'#f4f0e6':'#ef7a5a';c.beginPath();c.moveTo(0,py);c.arc(0,py,30,Math.PI+i*Math.PI/6,Math.PI+(i+1)*Math.PI/6);c.closePath();c.fill();}
      c.fillStyle='#b98a52';c.strokeStyle='#7a5a34';c.lineWidth=1.5;c.beginPath();c.roundRect(-34,6,20,13,3);c.fill();c.stroke();c.beginPath();c.arc(-24,6,8,Math.PI,0);c.stroke();
      c.restore();}
  }
  // boats in hands / in the air
  for(const b of boats){if(b.st==='hand'){const k=kids[b.kid];if(k.pop<0.5)continue;const j=Math.abs(Math.sin(k.jump*Math.PI*3))*10*S*(k.jump>0?1:0);drawBoat(sx(b.x,b.y),sy(b.x,b.y)-13*S-j,S*0.8*k.pop,0);}
    else if(b.st==='fly')drawBoat(sx(b.x,b.y),sy(b.x,b.y)-b.z*S,S*0.9,0);}
  // glow ring on the train when it is the thing to touch
  if(guide.t&&guide.t.k==='train'&&ptr.id===null){const pl=0.5+0.5*Math.sin(time*4.2);
    for(const cc of [tr.F,tr.R]){const X=sx(cc.x,cc.y),Y=sy(cc.x,cc.y)-14*S*hf;c.strokeStyle='rgba(255,255,200,'+(0.35+0.45*pl)+')';c.lineWidth=(3+2*pl)*S;c.beginPath();c.arc(X,Y,(46+5*pl)*S,0,TAU);c.stroke();}}
  // droplets / sparkles
  for(const p of parts){const X=sx(p.x,p.y),Y=sy(p.x,p.y)-p.z*S;c.globalAlpha=clamp(p.life*2.5,0,1);c.fillStyle=p.col?'#fff6b0':'#6cc3f2';c.beginPath();c.arc(X,Y,(p.col?2.8:2.4)*S,0,TAU);c.fill();}
  c.globalAlpha=1;
  // hand demo
  if(guide.hand){const h=guide.hand,u=h.u,e=clamp((u-0.15)/0.7,0,1),t=h.len*(e*e*(3-2*e));let i=1;while(i<h.cum.length-1&&h.cum[i]<t)i++;
    const f=clamp((t-h.cum[i-1])/((h.cum[i]-h.cum[i-1])||1),0,1),x=lerp(h.pts[i-1][0],h.pts[i][0],f),y=lerp(h.pts[i-1][1],h.pts[i][1],f);
    const a=clamp(Math.min(u/0.1,(1-u)/0.12),0,1);
    c.strokeStyle='rgba(255,255,255,'+0.6*a+')';c.lineWidth=2.5*S;c.beginPath();c.arc(sx(x,y),sy(x,y)-12*S,(u<0.15?24-u*80:12)*S,0,TAU);c.stroke();
    drawHand(sx(x,y),sy(x,y)-10*S,a*0.95,u>0.1&&u<0.9);}
  // "today's map" paper edge
  if(finale.k>0.01){const k=finale.k,m=(Math.max(vw,vh)*(1-zoom)/2+5)*2;c.strokeStyle='rgba(246,240,220,'+Math.min(1,1.6*k)+')';c.lineWidth=m;c.strokeRect(m/2,m/2,vw-m,vh-m);
    c.strokeStyle='rgba(150,120,70,'+0.6*k+')';c.lineWidth=2;c.strokeRect(m/2+1,m/2+1,vw-m-2,vh-m-2);}
}

/* ---------------- input ---------------- */
function carAt(px,py){
  const w=toWorld(px,py),hr=Math.max(48,38/S);let best=null,bd=hr;
  const dF=hyp(w[0]-tr.F.x,w[1]-tr.F.y),dR=hyp(w[0]-tr.R.x,w[1]-tr.R.y);
  if(dF<bd){bd=dF;best='F';}if(dR<bd){bd=dR;best='R';}
  return best?{car:best,w}:null;
}
function release(){ptr.id=null;tr.grab=null;gutterTouch.id=null;}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();initAudio();
  if(ptr.id!==null||gutterTouch.id!==null)return; // one finger drives; other fingers are ignored
  const h=carAt(ev.clientX,ev.clientY);
  if(!h){const w=toWorld(ev.clientX,ev.clientY);
    if(Math.abs(w[0]-330)<65&&w[1]>480&&w[1]<625){
      gutterTouch.id=ev.pointerId;gutterTouch.life=2;sfx.tick();
      try{cv.setPointerCapture(ev.pointerId);}catch(e){}
    }else wobbleAt(w[0],w[1]);
    guide.idle=Math.min(guide.idle,2);return;}
  ptr.id=ev.pointerId;ptr.x=ev.clientX;ptr.y=ev.clientY;
  const G=h.car==='F'?tr.F:tr.R;ptr.offx=G.x-h.w[0];ptr.offy=G.y-h.w[1];
  tr.grab=h.car;tr.mode=h.car==='F'?1:-1;guide.touched=true;guide.idle=0;guide.hand=null;
  if(finale.on&&finale.t>2.5)nextLap(); // touching the train again starts the next lap
  // immediate response: body dips on its tyres, wheels jolt, a little spray
  G.sv+=95;G.wh+=5;(h.car==='F'?tr.R:tr.F).sv+=40;(h.car==='F'?tr.R:tr.F).wh+=3;
  for(let i=0;i<5;i++){const a=Math.random()*TAU;drop(G.x+Math.cos(a)*24,G.y+Math.sin(a)*16,Math.cos(a)*50,Math.sin(a)*50,50,0);}
  sfx.tap();
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
},{passive:false});
cv.addEventListener('pointermove',ev=>{if(ev.pointerId===ptr.id){ev.preventDefault();ptr.x=ev.clientX;ptr.y=ev.clientY;}},{passive:false});
const up=ev=>{initAudio();if(ev.pointerId===ptr.id||ev.pointerId===gutterTouch.id)release();};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
window.addEventListener('blur',release);
for(const t of ['touchstart','touchmove','touchend','gesturestart','gesturechange','contextmenu','selectstart','dblclick','wheel'])
  document.addEventListener(t,e=>{if(e.cancelable)e.preventDefault();},{passive:false});

/* ---------------- loop ---------------- */
let raf=0,last=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))return;if(dt>0.05)dt=0.05;
  update(dt);render();
}
function start(){if(raf)return;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();release();if(dirty)saveNow();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{try{if(AC&&AC.state==='suspended'&&guide.touched)AC.resume().catch(()=>{});}catch(e){}start();}
});
window.addEventListener('pagehide',()=>{if(dirty)saveNow();});
let rzT=0;const onRz=()=>{resize();if(!raf&&!document.hidden)render();};
window.addEventListener('resize',onRz);window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(onRz,120);});

/* ---------------- boot ---------------- */
placeTrain();load();resize();
window.__gf={tr,ponds,sponges,edges,tray,gate,disc,dacc,boats,kids,guide,finale,packets:()=>packets,parts,toWorld,
  scr:(x,y)=>[sx(x,y),sy(x,y)],grab:(c)=>{ptr.id=-9;tr.grab=c;tr.mode=c==='F'?1:-1;ptr.offx=ptr.offy=0;guide.touched=true;},aim:(x,y)=>{ptr.wo=[x,y];},rel:()=>{ptr.wo=null;release();},place:(o)=>{Object.assign(tr,o);frames();},lap:()=>lap,picnic:()=>picnic,step:(dt)=>update(dt),view:()=>({S,ox,oy,land,vw,vh,dpr})};
if(!document.hidden)start();
})();
</script>
