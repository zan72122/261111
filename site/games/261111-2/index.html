function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- streaks ----------
let streaks = [];
let roundNo = 0;
function crackLine(r, pts, amp, seg) {

}
function makeStreaks(seed) {

  const bu = o2cU(BALL.u), bv = o2cV(BALL.v), br = BALL.r * K, bru = br / ASP;
  const g0 = carGeom(0.5, 1, GY);

  const mv = (o2cV(g0.my0) + o2cV(g0.my1)) / 2;                   // mirror band

  { const u = bu + bru * 0.5 + J(0.008);
    add('ball', [crackLine(r, [[u + J(.01), bv - br * 0.95], [u - 0.012 + J(.01), bv - br * 0.3], [u + 0.01 + J(.01), bv + br * 0.35], [u - 0.012 + J(.01), bv + br * 1.05]], amp, seg)], 0.06); }

// ---------- persistence (one photo) ----------
function savePhoto() {

}
function loadPhoto() {

  for (const r of rings) { ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 70, 0, Math.PI * 2); ctx.strokeStyle = `rgba(150,255,225,${(1 - r.t) * 0.6})`; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}
function drawHalo() {
  if (S.boost < 1.03) return;
  const k = (S.boost - 1) / 0.75; const a = clamp(k * (0.12 + avgStored() * 0.9), 0, 0.45);
  const cx = X(0.5), cy = Y(0.6), rr = R.w * 0.95;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, R.w * 0.3, cx, cy, rr); g.addColorStop(0, `rgba(70,230,200,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - rr, cy - rr, rr * 2, rr * 2); ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bgCv) ctx.drawImage(bgCv, 0, 0); else { ctx.fillStyle = '#030b16'; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const I = S.mode === 'play' ? lightI() : 0;
  const tc = totalClean();
  buildGlow(); buildSmall(hImg, hCx, hStored, hFresh, HW * HH); buildSmall(oImg, oCx, oStored, oFresh, OW * OH);
  drawHalo();
  drawBeam(I, tc);
  if (S.leak && S.leakA > 0) { const sb = S.beamT; S.beamT = 1; drawBeam(S.leakA * 0.5, tc); S.beamT = sb; }
  drawOuter();
  drawTent();
  if (car.behind) drawCar(0.45); // x-ray: seen through the cloth
  drawBall();
  if (!car.behind) drawCar(1);
  drawSideBeams(I);
  drawHand();
  drawProjector();
  drawParticles();
  drawHint();
  drawDemo();
}

// ---------- loop ----------
let last = 0, running = true, raf = 0;
function frame(ts) {
  raf = 0; if (!running) return;
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  const c0 = performance.now();
  try { step(dt); render(); if (S.downAt && !S.visAt) S.visAt = performance.now(); } catch (e) { if (!frame.err) { frame.err = 1; console.warn(e); } }
  S.cost = S.cost ? S.cost * 0.95 + (performance.now() - c0) * 0.05 : performance.now() - c0;
  raf = requestAnimationFrame(frame);
}
function start() { if (!raf && running) { last = 0; raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (S.press) endPress();
    if (AC && motorG) { try { motorG.gain.setValueAtTime(0, AC.currentTime); humG.gain.setValueAtTime(0, AC.currentTime); } catch (e) { } }
    if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) { } }
  } else {
    running = true; last = 0; start();
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { } }
  }
});
window.addEventListener('pagehide', () => { if (S.press) endPress(); });
let rzT = 0;
function onResize() { if (rzT) clearTimeout(rzT); rzT = setTimeout(() => { rzT = 0; doLayout(); }, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// ---------- test hooks (read-only state; no UI) ----------
window.__tent = {
  state: () => ({ mode: S.mode, lid: S.lid, press: S.press, car: { u: car.u, x: car.x, mode: car.mode, moved: car.moved, dir: car.dir }, door: S.door, latch: S.latch,
    fracs: streaks.map(s => +s.frac.toFixed(3)), roles: streaks.map(s => s.role), disc: Object.assign({}, disc), log: discLog.slice(), loadState: S.loadState, saveOk: S.saveOk,
    storedAvg: avgStored(), hMax: Math.max.apply(null, Array.from(hStored)), oMax: Math.max.apply(null, Array.from(oStored)), round: roundNo, parts: parts.length, hint: S.hint ? S.hint.id : -1, demo: S.demoT, cost: S.cost, tapLatency: S.visAt && S.downAt ? S.visAt - S.downAt : null, audio: AC ? AC.state : null }),
  streakPts: i => streakScreen(streaks[i]).map(l => l.map(p => [p[0], p[1]])),
  hintPt: () => S.hint ? hintPoint(S.hint) : null,
  layout: () => ({ R, F, HC, OC, W, H, SA }),
  filmAlphaAt: (x, y) => { if (filmDirty) refreshFilm(); const d = filmCur.getContext('2d').getImageData(Math.round((x - F.x) * DPR), Math.round((y - F.y) * DPR), 1, 1).data; return d[3]; },
  storedAt: (u, v) => stored[Math.min(GH - 1, Math.floor(v * GH)) * GW + Math.min(GW - 1, Math.floor(u * GW))],
  ballC: () => ({ u: o2cU(BALL.u), v: o2cV(BALL.v), r: BALL.r * K }),
  carC: () => { const g = carGeom(car.u, car.dir, GY); return { t2: [o2cU(g.t2[0]), o2cV(g.t2[1])], t0: [o2cU(g.t0[0]), o2cV(g.t0[1])], t1: [o2cU(g.t1[0]), o2cV(g.t1[1])] }; }
};

// ---------- boot ----------
loadPhoto();
newRound(true);
doLayout();
start();
})();
</script>
